<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Binocular Telescope - Ondřejov Observatory</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --panel-bg: #ffffff;
            --border: #ccc;
            --text: #000000;
            --text-muted: #555;
            --th-bg: #ddd;
            --logo-bg: #e8e8e8;
            --good: #008b00;
            --warn: #8B0000;
            --error: #ff0000;
            --graph-line: #2563eb;
            --graph-band: rgba(37, 99, 235, 0.18);
            --graph-day-bg: rgba(255, 190, 40, 0.12);
            --graph-twilight-bg: rgba(37, 99, 235, 0.08);
        }

        body.dark {
            --bg: #1a1a1a;
            --panel-bg: #262626;
            --border: #444;
            --text: #ddd;
            --text-muted: #aaa;
            --th-bg: #333;
            --logo-bg: #2f2f2f;
            --good: #4fd14f;
            --warn: #ff8a8a;
            --error: #ff5c5c;
            --graph-line: #6fb3ff;
            --graph-band: rgba(111, 179, 255, 0.22);
            --graph-day-bg: rgba(255, 190, 40, 0.10);
            --graph-twilight-bg: rgba(111, 179, 255, 0.10);
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg);
            color: var(--text);
            font-size: 12px;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 10px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            /* Otherwise a grid item stretches to match the row height -
               cam-panel is much taller now (three stacked camera rows),
               and the title/status column should stay its own natural
               height rather than growing to fill that, per the ask that
               it read as a compact vertical block beside the cameras. */
            align-self: start;
        }

        .status-panel, .image-panel, .webcam-panel, .cam-panel, .cloud-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 5px;
        }

        .logo {
            text-align: center;
            border: 2px solid var(--text);
            padding: 10px;
            background-color: var(--logo-bg);
        }

        .logo h1 { margin: 5px 0; font-size: 24px; }
        .logo h2 { margin: 5px 0; font-size: 14px; font-weight: normal; }

        .temp-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 11px;
        }

        .temp-table th, .temp-table td {
            border: 1px solid var(--border);
            padding: 3px;
            text-align: center;
        }

        .temp-table th { background-color: var(--th-bg); font-weight: bold; }

        .webcam-panel, .cloud-panel {
            /* Placed as a direct grid child of .container (not nested
               inside .left-panel, which is fixed at 320px) so it can
               span the full page width, below the title/status +
               cameras row. */
            grid-column: 1 / -1;
        }

        #cloud-canvas {
            display: block;
            width: 100%;
            /* the canvas has no intrinsic size to lay itself out from,
               and drawCloudGraph() takes its backing store from this box */
            height: 220px;
        }

        .cloud-ranges { float: right; }
        .cloud-ranges button {
            font-size: 11px;
            padding: 2px 7px;
            margin-left: 4px;
            cursor: pointer;
            background: var(--panel-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        .cloud-ranges button.active { background: var(--good); color: white; border-color: var(--good); }

        .cloud-status { margin-top: 4px; font-size: 11px; color: var(--text-muted); }
        .cloud-status.warn { color: var(--warn); }

        /* cam-panel stays beside .left-panel (title/status), occupying
           .container's second (flexible) column - not full width, per
           the user's ask to keep the title/status sidebar next to the
           cameras rather than above them. One row per camera within
           it, stacked vertically, each row showing its two images
           large. */
        .cam-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cam-box {
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cam-box h4 {
            margin: 0;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            flex-shrink: 0;
        }

        .cam-box-body { flex: 1; min-width: 0; }

        .latest-image {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 6px;
        }

        .latest-image img {
            width: 100%;
            height: 480px;
            object-fit: contain;
            background: #111;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .latest-image-info {
            font-size: 10px;
            color: var(--text-muted);
            white-space: pre-line;
            text-align: left;
            margin: 0 0 6px 0;
        }

        .webcam-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .webcam-column {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        .webcam-column img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            background: #000;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        /* Space is dark regardless of page theme, so this doesn't
           follow --panel-bg/--text like everything else. */
        /* No title and a thin padding: the chart is the panel. */
        .sky-panel { padding: 4px; line-height: 0; }
        #sky-canvas { width: 100%; height: auto; aspect-ratio: 1; border-radius: 50%; cursor: pointer; }

        .control-buttons { display: flex; gap: 5px; flex-wrap: wrap; }

        .control-buttons button {
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            background: var(--panel-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
        }

        .state-buttons button { font-weight: bold; padding: 8px 10px; font-size: 12px; flex: 1; }
        .state-buttons .state-on { border-color: var(--good); color: var(--good); }
        .state-buttons .state-standby { border-color: #b8860b; color: #b8860b; }
        .state-buttons .state-off { border-color: var(--warn); color: var(--warn); }

        #equalize-btn, #live-btn, #led-btn {
            cursor: pointer;
            background: var(--panel-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        #equalize-btn.active, #live-btn.active { background: var(--good); color: white; border-color: var(--good); }
        #led-btn.on { background: #d97706; color: white; border-color: #d97706; }

        .status-value { margin: 3px 0; }

        .error { color: var(--error); font-weight: bold; }
        .good { color: var(--good); }
        .warn { color: var(--warn); }
        .standby { color: #b8860b; font-weight: bold; }

        hr { margin: 10px 0; border: 1px solid var(--border); }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }

        .lightbox-content {
            position: relative;
            margin: auto;
            padding: 20px;
            width: 90%;
            height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* title/info take their natural height; the wrap flexes to
           fill whatever's left of the 90vh box, and centers the image
           inside it. The image's own box is sized in JS to its actual
           fitted (scaled up or down) pixel size - not just left at
           100%/100% of the wrap - so the border/shadow hug the visible
           picture instead of an invisible, letterboxed square around
           it (which read as "transparent and buggy" for anything not
           already the wrap's exact aspect ratio). */
        .lightbox-title, .lightbox-info { flex: 0 0 auto; }
        .lightbox-img-wrap {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .lightbox img, .lightbox-img-wrap canvas {
            display: block;
            object-fit: contain;
            border: 2px solid white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Enlarged sky chart shown in the lightbox - round, like the
           sidebar one, and hidden by default since the lightbox is
           normally showing #lightbox-img instead (openLightbox() vs.
           openSkyLightbox() toggle which of the two is visible). */
        #lightbox-sky-canvas { display: none; border-radius: 50%; }

        .lightbox-title { color: white; font-size: 18px; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .lightbox-close { position: absolute; top: 10px; right: 25px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; user-select: none; }
        .lightbox-close:hover { color: #ccc; }
        .lightbox-info { color: white; font-size: 14px; margin-top: 10px; text-align: center; }

        /* Compact mode (toggled via JS, persisted in a cookie, not tied
           to viewport width like the media queries below) - squeezes
           the page enough to fit on one screen for a quick glance,
           per the ask that the default layout is "děsně roztahaný". */
        body.compact .container { max-width: none; gap: 6px; }
        body.compact .status-panel, body.compact .image-panel,
        body.compact .webcam-panel, body.compact .cam-panel, body.compact .cloud-panel { padding: 5px; }
        body.compact .logo { padding: 4px; }
        body.compact .logo h1 { font-size: 16px; margin: 2px 0; }
        body.compact .logo h2 { font-size: 11px; margin: 2px 0; }
        /* Three cameras side by side as columns instead of stacked
           rows - each column is narrow (one square image's width) but
           tall, which uses the available width far better than a wide
           short row does once everything else has already been
           shrunk. Mirrors the same column layout the narrow-viewport
           breakpoint below already uses, for the same reason (a
           .cam-box that's taller than it is wide wants its label and
           the two images stacked, not side by side). */
        body.compact .cam-grid { flex-direction: row; gap: 4px; }
        body.compact .cam-box { flex: 1; flex-direction: column; align-items: stretch; padding: 4px; gap: 4px; }
        body.compact .cam-box h4 { writing-mode: horizontal-tb; transform: none; text-align: center; }
        body.compact .latest-image { grid-template-columns: 1fr; gap: 4px; margin-bottom: 2px; }
        /* Unlike everywhere else, compact mode doesn't fix a height
           here - two square images plus a few lines of text is exactly
           what compact mode is squeezing for, so let each image size
           itself off the column's width instead of being letterboxed
           (black padding) into a fixed box. C3's 3:2 webcam naturally
           ends up a different height than C1/C2's square ones - fine,
           per the site's own call. */
        body.compact .latest-image img { height: auto; object-fit: initial; background: none; }
        body.compact .latest-image-info { font-size: 9px; }
        body.compact .webcam-grid { gap: 4px; }
        body.compact .webcam-column img { aspect-ratio: 16 / 9; }
        body.compact .temp-table { margin: 4px 0; }
        body.compact .control-buttons { gap: 3px; }
        body.compact .control-buttons button { padding: 3px 6px; }
        body.compact hr { margin: 4px 0; }

        /* Non-compact mode reflows at these breakpoints. Compact mode
           gets its own, much narrower ones below - it's already dense
           (small fonts, side-by-side camera columns), so it doesn't
           need to fall back to the same "stack everything, one column"
           phone layout non-compact mode needs at 1200/700px. Without
           this split, a window taking up half of a wide (e.g. 2560px)
           screen - easily still >1200 real CSS px, or squeezed further
           by OS display scaling - dropped straight into that stacked
           layout even in compact mode, defeating the point of turning
           compact mode on in the first place. */
        @media (max-width: 1200px) {
            body:not(.compact) .container { grid-template-columns: 1fr; }
            body:not(.compact) .webcam-grid { grid-template-columns: repeat(2, 1fr); }
            body:not(.compact) .latest-image img { height: 320px; }
        }

        @media (max-width: 700px) {
            body:not(.compact) .webcam-grid { grid-template-columns: 1fr; }
            body:not(.compact) .cam-box { flex-direction: column; align-items: stretch; }
            body:not(.compact) .cam-box h4 { writing-mode: horizontal-tb; transform: none; text-align: center; }
            body:not(.compact) .latest-image { grid-template-columns: 1fr; }
            body:not(.compact) .latest-image img { height: 220px; }

            body.compact .webcam-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            body.compact .container { grid-template-columns: 1fr; }
            body.compact .webcam-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <script>
        // Applied inline, before the rest of the page renders, so
        // dark/compact mode doesn't flash the default theme first.
        (function () {
            const m = document.cookie.match(/(?:^|; )darkMode=1(?:;|$)/);
            if (m) document.body.classList.add('dark');
            const c = document.cookie.match(/(?:^|; )compactMode=1(?:;|$)/);
            if (c) document.body.classList.add('compact');
        })();
    </script>
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close">&times;</span>
            <div class="lightbox-title" id="lightbox-title"></div>
            <div class="lightbox-img-wrap">
                <img id="lightbox-img" src="" alt="Lightbox Image">
                <canvas id="lightbox-sky-canvas"></canvas>
            </div>
            <div class="lightbox-info" id="lightbox-info">Click anywhere to close</div>
        </div>
    </div>

    <div class="container">
        <div class="left-panel">
            <div class="status-panel">
                <div class="logo">
                    <h1>Small Binocular Telescope</h1>
                    <h2>Ondřejov Observatory</h2>
                </div>
                <div id="status-info">
                    <div class="status-value"><strong>Status:</strong> <span id="serverd-status">...</span></div>
                    <div id="bad-weather-reason" class="status-value error" style="display: none;"></div>
                    <div id="telescope-status"></div>
                    <div id="dome-status"></div>
                    <hr>
                    <div id="weather-status"></div>
                </div>
            </div>

            <div class="status-panel sky-panel">
                <canvas id="sky-canvas" width="300" height="300" title="Click to enlarge"></canvas>
            </div>

            <div class="control-buttons state-buttons">
                <button class="state-on" onclick="switchState('on')">ON</button>
                <button class="state-standby" onclick="switchState('standby')">STANDBY</button>
                <button class="state-off" onclick="switchState('off')">OFF</button>
            </div>
            <div id="state-msg" class="status-value"></div>

            <div class="control-buttons">
                <button onclick="reloadWebcams()">reload webcams</button>
                <button onclick="openArchive()">image archive</button>
                <button onclick="toggleDarkMode()">dark mode</button>
                <button onclick="toggleCompactMode()">compact mode</button>
            </div>
        </div>

        <div class="cam-panel">
            <h3 style="margin-top: 0;">Cameras</h3>
            <div class="cam-grid">
                <div class="cam-box">
                    <h4>C1</h4>
                    <div class="cam-box-body">
                        <div class="latest-image">
                            <img id="c1-image" src="C1_small.jpg" alt="C1" onclick="openLightbox('C1_full.jpg', 'C1 - Full Image')">
                            <img id="c1-center" src="C1_center.jpg" alt="C1 center" onclick="openLightbox('C1_full.jpg', 'C1 - Full Image')">
                        </div>
                        <div id="c1-info" class="latest-image-info"></div>
                        <div id="c1-status"></div>
                    </div>
                </div>
                <div class="cam-box">
                    <h4>C2</h4>
                    <div class="cam-box-body">
                        <div class="latest-image">
                            <img id="c2-image" src="C2_small.jpg" alt="C2" onclick="openLightbox('C2_full.jpg', 'C2 - Full Image')">
                            <img id="c2-center" src="C2_center.jpg" alt="C2 center" onclick="openLightbox('C2_full.jpg', 'C2 - Full Image')">
                        </div>
                        <div id="c2-info" class="latest-image-info"></div>
                        <div id="c2-status"></div>
                    </div>
                </div>
                <div class="cam-box">
                    <h4>C3</h4>
                    <div class="cam-box-body">
                        <div class="latest-image">
                            <img id="c3-image" src="C3_small.jpg" alt="C3" onclick="openLightbox('C3_full.jpg', 'C3 - Full Image')">
                            <img id="c3-center" src="C3_center.jpg" alt="C3 center" onclick="openLightbox('C3_full.jpg', 'C3 - Full Image')">
                        </div>
                        <div id="c3-info" class="latest-image-info"></div>
                        <div id="c3-status"></div>
                    </div>
                </div>
            </div>
            <!--
                C{n}_small.jpg/C{n}_center.jpg/C{n}_full.jpg/
                C{n}_info.txt are written by the same external
                dark+flat-correction process D50's monitor.html
                already relies on, as sibling files in this page's
                own directory - confirmed present for C1/C2/C3 on
                lascaux (not the rts2ng /preview endpoint's raw,
                uncorrected output this page used before).
            -->
        </div>

        <div class="webcam-panel">
            <h3 style="margin-top: 0;">
                Webcams
                <button id="equalize-btn" onclick="toggleEqualize()" style="font-size: 11px; padding: 3px 8px; margin-left: 10px;">equalize</button>
                <button id="live-btn" onclick="toggleLive()" style="font-size: 11px; padding: 3px 8px; margin-left: 6px;">live</button>
                <button id="led-btn" onclick="toggleSentinelLed()" style="font-size: 11px; padding: 3px 8px; margin-left: 6px;">LED light</button>
            </h3>
            <div class="webcam-grid">
                <div class="webcam-column">
                    <div>AllSky</div>
                    <img id="webcam-allsky" data-cam="allsky" alt="AllSky">
                </div>
                <div class="webcam-column">
                    <div>Sentinel</div>
                    <img id="webcam-sentinel" data-cam="sentinel" alt="Sentinel">
                </div>
                <div class="webcam-column">
                    <div>Webcam 3</div>
                    <img id="webcam-3" data-cam="3" alt="Webcam 3">
                </div>
                <div class="webcam-column">
                    <div>Webcam 4</div>
                    <img id="webcam-4" data-cam="4" alt="Webcam 4">
                </div>
                <div class="webcam-column">
                    <div><a href="/observ/allsky-d65/" target="_blank" title="the camera's own page, with its image archive">AllSky (D65)</a></div>
                    <img id="webcam-allskyd65" data-cam="allskyd65" alt="AllSky (D65)">
                </div>
            </div>
            <!--
                Periodically-refreshed snapshot files under /webcam/
                (proxied by Apache to a separate LAN host, 10.0.0.52,
                not this box's own filesystem - confirmed live via
                Last-Modified headers on the real public URLs, since a
                same-named local directory on lascaux itself turned out
                to be a stale, unrelated 2010-2011 leftover). Plain and
                "_eq" (locally equalized-contrast) variants both
                confirmed present for all four cameras, toggled via the
                WEBCAMS table below - and the "live" button switches all
                four to their live MJPEG feed instead (see WEBCAMS'
                `live` field and toggleLive()).
            -->
        </div>

        <div class="cloud-panel">
            <h3 style="margin-top: 0;">
                Cloud sensor - sky temperature difference
                <span id="cloud-ranges" class="cloud-ranges">
                    <button data-hours="8" onclick="setCloudRange(8)">8 h</button>
                    <button data-hours="24" onclick="setCloudRange(24)">24 h</button>
                    <button data-hours="72" onclick="setCloudRange(72)">3 d</button>
                </span>
            </h3>
            <!--
                Drawn from JSON (/api/db/records) instead of the
                /images/graph/CLOUD/TEMP_DIFF JPEG this panel used to
                pull off lascaux50: that plotter lived inside classic
                httpd and went away with it when D50 moved to rts2ng.

                The series is read from *D50's* daemon, not this host's -
                see CLOUD_API_BASE below. Same 8 h default the old image
                used; the range buttons are new, and the choice is
                remembered in a cookie like the page's other preferences.
            -->
            <canvas id="cloud-canvas"></canvas>
            <div id="cloud-status" class="cloud-status"></div>
        </div>
    </div>

    <script>
        // Talks directly to rts2ng's rts2-httpd (task 2's JSON API) -
        // reads are unauthenticated by that daemon's own design
        // (STATUS.md task 6), so unlike D50's monitor.html this page
        // embeds no credentials at all.
        const API_BASE = '/images/api';

        // Plain vs "_eq" (locally contrast-equalized) filenames for each
        // webcam - both variants confirmed live on the real site (curl
        // -I, fresh Last-Modified) rather than guessed from the naming
        // of the one dead local leftover directory that looked similar.
        // `live` is each camera's raw MJPEG multipart stream (mjpg-
        // streamer's own ?action=stream convention) - confirmed live
        // via curl on lascaux itself (200, multipart/x-mixed-replace)
        // for allsky/3/4, which Apache proxies same-origin from
        // 10.0.0.52:81/82/83 (see /etc/apache2/sites-available on
        // lascaux).
        //
        // Sentinel has no `live` entry - it's a different camera on a
        // different host (sentinel.asu.cas.cz), and getting its stream
        // proxied same-origin turned out to be a dead end: even past
        // the embedded-credentials issue (browsers block <img>/fetch
        // loads whose URL has userinfo in it) and past mod_proxy not
        // actually forwarding those embedded credentials to the backend
        // on its own (needs an explicit RequestHeader), its firmware
        // sends a malformed response header (a literal space before the
        // colon, e.g. "SID : 0") that Apache 2.4.68's stricter RFC 7230
        // header-name validation refuses to relay at all (AH02429) -
        // confirmed live on lascaux, not guessed. Fixed 2026-10-13
        // without relaxing the whole vhost (`HttpProtocolOptions
        // Unsafe`): lascaux's /observ/sentinel/ proxy unsets those
        // headers (`Header unset "SID "` etc.) in its own <Location>,
        // and sends the camera's credentials itself, behind lascaux's
        // /observ login, as on lascaux50 (web/STATUS.md). The camera's
        // firmware has a known security hole, so this proxy is its only
        // way in.
        const WEBCAMS = [
            { id: 'allsky', label: 'AllSky',
                small: 'allsky_small.jpg', smallEq: 'allsky_eq_small.jpg',
                full: 'allsky.jpg', fullEq: 'allsky_eq.jpg',
                live: '/webcam2/?action=stream' },
            { id: 'sentinel', label: 'Sentinel',
                small: 'sentinel-sum1_av_small.jpg', smallEq: 'sentinel-sum1_av_eq_small.jpg',
                full: 'sentinel-sum1_av.png', fullEq: 'sentinel-sum1_av_eq.png',
                live: '/observ/sentinel/video.mjpg' },
            { id: '3', label: 'Webcam 3',
                small: 'webcam3_small.jpg', smallEq: 'webcam3_eq_small.jpg',
                full: 'webcam3.jpg', fullEq: 'webcam3_eq.jpg',
                live: '/webcam3/?action=stream' },
            { id: '4', label: 'Webcam 4',
                small: 'webcam4_small.jpg', smallEq: 'webcam4_eq_small.jpg',
                full: 'webcam4.jpg', fullEq: 'webcam4_eq.jpg',
                live: '/webcam4/?action=stream' },
            // The all-sky camera by the 0.65 m telescope, as D50's page
            // shows it, through lascaux's /observ/allsky-d65/ proxy as
            // D50's goes through lascaux50's. Not straight from the
            // camera's server: that needs no login inside the institute,
            // but asks for one from outside, so the image stayed blank
            // until the visitor logged in there. One 640x480 image, no
            // equalized version, no stream. `host` overrides the default
            // /webcam/.
            { id: 'allskyd65', label: 'AllSky (D65)',
                small: 'AllSkyCurrentImage.JPG', smallEq: 'AllSkyCurrentImage.JPG',
                full: 'AllSkyCurrentImage.JPG', fullEq: 'AllSkyCurrentImage.JPG',
                host: '/observ/allsky-d65/' },
        ];

        let systemData = {
            centrald: {},
            EXEC: {}, T0: {}, DOME: {},
            C1: {}, C2: {}, C3: {},
            F1: {}, F2: {}, F3: {},
            IMGP: {},
            WEATHER_BART: {}, RAIN_BART: {}, RAIN_D50: {}, CLOUD: {},
            DISK_BART: {}, BARTUPS: {}
        };

        // Devices read from another telescope's rts2-httpd rather than
        // this host's. RAIN_D50 is D50's own rain sensor; it goes through
        // the same /d50 Apache proxy as the cloud history (see
        // CLOUD_API_BASE), which is certain to have it, whether or not
        // this host's bus carries it too.
        const REMOTE_DEVICES = { RAIN_D50: '/d50/api' };

        const DEVICES = Object.keys(systemData);

        // rts2ng's httpd uses the RTS2 value's own name as the JSON key
        // verbatim - some real value names contain a literal "." (e.g.
        // BARTUPS's "ups.status", "battery.charge"), which is a flat key,
        // not a nested object. Try the literal key first; only fall back
        // to dot-path traversal for genuinely nested data. Confirmed
        // against this daemon's real /api/get?d=BARTUPS output.
        function getNestedValue(obj, path) {
            if (obj && obj[path] !== undefined)
                return obj[path];
            return path.split('.').reduce((cur, key) => cur && cur[key] !== undefined ? cur[key] : undefined, obj);
        }

        function safeValue(obj, key, defaultVal = 'N/A') {
            const val = getNestedValue(obj, key);
            return val !== undefined ? val : defaultVal;
        }

        function fmt(val, digits = 1) {
            return typeof val === 'number' && !Number.isNaN(val) ? val.toFixed(digits) : 'N/A';
        }

        // rts2ng's httpd serializes RA/Dec-pair values (RTS2_VALUE_RADEC
        // et al, no dedicated case in jsonvalue.cpp's switch) via their
        // getDisplayValue() fallback - a single "ra dec" space-separated
        // string (e.g. "159.7 52.5", or "nan nan" when unset), not a
        // {ra,dec} nested object the way classic's httpd/D50's
        // monitor.html assumes. Confirmed against this daemon's real
        // /api/get?d=T0 output, not guessed.
        function parseRaDec(str) {
            if (typeof str !== 'string')
                return [NaN, NaN];
            const parts = str.trim().split(/\s+/).map(Number);
            return parts.length === 2 ? parts : [NaN, NaN];
        }

        function formatTime(timeVal) {
            return typeof timeVal === 'number' ? new Date(timeVal * 1000).toLocaleString() : 'N/A';
        }

        async function fetchDeviceData(deviceName, base = API_BASE) {
            try {
                const res = await fetch(`${base}/get?d=${deviceName}`);
                if (!res.ok)
                    throw new Error(`${res.status}`);
                const data = await res.json();
                return data.d || data;
            } catch (e) {
                console.error(`Failed to fetch ${deviceName}:`, e);
                return null;
            }
        }

        async function updateAllDeviceData() {
            await Promise.all(DEVICES.map(async device => {
                const data = await fetchDeviceData(device, REMOTE_DEVICES[device]);
                if (data)
                    systemData[device] = data;
            }));
        }

        // rts2ng's /api/getall,get always send a selection value (e.g.
        // "filter") as its bare numeric index (see jsonvalue.cpp) -
        // fetched once per camera via /api/selval and cached, not
        // refetched every poll, since the option list only changes if
        // the wheel itself is reconfigured. Left null (and retried next
        // poll) if the device wasn't reachable yet.
        const filterNames = { C1: null, C2: null, C3: null };

        async function loadFilterNames() {
            await Promise.all(['C1', 'C2', 'C3'].map(async cam => {
                if (filterNames[cam])
                    return;
                try {
                    const res = await fetch(`${API_BASE}/selval?d=${cam}&n=filter`);
                    if (!res.ok)
                        return;
                    filterNames[cam] = await res.json();
                } catch (e) {
                    console.error(`Failed to fetch filter names for ${cam}:`, e);
                }
            }));
        }

        // Sexagesimal, as the old PHP page (rts2phplib/miscfunc.inc
        // dec_tostring/ra_tostring) printed them: +DD°MM'SS.ss" and
        // HH:MM:SS.ss. Rounded once, on the total, so 59.999" carries
        // into the minute instead of printing as 60.00".
        function fmtSexa(val, digits = 2) {
            if (typeof val !== 'number' || !Number.isFinite(val))
                return null;
            const scale = 3600 * 10 ** digits;
            const total = Math.round(Math.abs(val) * scale);
            const d = Math.floor(total / scale);
            const m = Math.floor(total % scale / (scale / 60));
            const sec = (total % (scale / 60)) / 10 ** digits;
            return [val < 0 ? '-' : '+', d, String(m).padStart(2, '0'),
                sec.toFixed(digits).padStart(digits ? digits + 3 : 2, '0')];
        }

        function fmtDeg(deg, digits = 2) {
            const p = fmtSexa(deg, digits);
            return p ? `${p[0]}${String(p[1]).padStart(2, '0')}&deg;${p[2]}'${p[3]}"` : 'N/A';
        }

        function fmtRa(deg, digits = 2) {
            const p = fmtSexa(typeof deg === 'number' ? ((deg % 360) + 360) % 360 / 15 : deg, digits);
            return p ? `${String(p[1]).padStart(2, '0')}:${p[2]}:${p[3]}` : 'N/A';
        }

        // T0's RA/Dec-pair values, as D50's old fr_status.php showed them
        // (same layout as d50-monitor.html, minus D50's block_move). TEL_ is
        // the mount's own Alt/Az ("alt az" in that order, the same value
        // drawSkyChart() plots); OFFS is the offset requested by scripts
        // or the user, CORR_ the correction from astrometry of the last
        // image(s).
        function updateTelescopeStatus() {
            const div = document.getElementById('telescope-status');
            const currentName = safeValue(systemData.EXEC, 'current_name', '');
            const current = safeValue(systemData.EXEC, 'current', -1);
            const nextName = safeValue(systemData.EXEC, 'next_name', '');
            const [objRa, objDec] = parseRaDec(safeValue(systemData.T0, 'OBJ', ''));
            const [telRa, telDec] = parseRaDec(safeValue(systemData.T0, 'TEL', ''));
            const [telAlt, telAz] = parseRaDec(safeValue(systemData.T0, 'TEL_', ''));
            const [offsRa, offsDec] = parseRaDec(safeValue(systemData.T0, 'OFFS', ''));
            const [corrRa, corrDec] = parseRaDec(safeValue(systemData.T0, 'CORR_', ''));
            const airmass = safeValue(systemData.T0, 'AIRMASS', NaN);
            const tracking = safeValue(systemData.T0, 'TRACKING', 0) == 1;
            const infotime = safeValue(systemData.T0, 'infotime', null);

            div.innerHTML = `
                <div class="status-value"><strong>Object:</strong> ${currentName || '(none)'} (${current})</div>
                <div class="status-value"><strong>Next:</strong> ${nextName || '(none)'}</div>
                <div class="status-value"><strong>Coordinates:</strong> ${fmtRa(objRa)} ${fmtDeg(objDec)}</div>
                <div class="status-value"><strong>Offsets:</strong> ${fmtDeg(offsRa)} ${fmtDeg(offsDec)}</div>
                <div class="status-value"><strong>Corrections:</strong> ${fmtDeg(corrRa)} ${fmtDeg(corrDec)}</div>
                <div class="status-value"><strong>T0 RA/Dec:</strong> ${fmtRa(telRa)} ${fmtDeg(telDec)}</div>
                <div class="status-value"><strong>T0 Alt/Az:</strong> ${fmtDeg(telAlt)} ${fmtDeg(telAz)}</div>
                <div class="status-value"><strong>Airmass:</strong> ${fmt(airmass, 2)}</div>
                <div class="status-value"><strong>Tracking:</strong> <span class="${tracking ? 'good' : 'warn'}">${tracking ? 'On' : 'Off'}</span></div>
                <div class="status-value"><strong>T0 info time:</strong> ${typeof infotime === 'number' ? new Date(infotime * 1000).toISOString().replace('T', ' ').slice(0, 19) + ' UT' : 'N/A'}</div>
            `;
        }

        function updateDomeStatus() {
            const div = document.getElementById('dome-status');
            const opened = safeValue(systemData.DOME, 'south_roof_opened', 0) == 1;
            const closed = safeValue(systemData.DOME, 'south_roof_closed', 0) == 1;
            const weatherOpen = safeValue(systemData.DOME, 'weather_open', 0) == 1;
            div.innerHTML = `
                <div class="status-value"><strong>Roof:</strong> <span class="${opened ? 'warn' : 'good'}">${opened ? 'Open' : (closed ? 'Closed' : 'Moving/unknown')}</span></div>
                <div class="status-value"><strong>Weather allows opening:</strong> <span class="${weatherOpen ? 'good' : 'warn'}">${weatherOpen ? 'Yes' : 'No'}</span></div>
            `;
        }

        function updateCameraStatus() {
            for (const cam of ['C1', 'C2', 'C3']) {
                const div = document.getElementById(cam.toLowerCase() + '-status');
                const d = systemData[cam];
                const object = safeValue(d, 'OBJECT', '');
                const exposure = safeValue(d, 'exposure', NaN);
                const exposureEnd = safeValue(d, 'exposure_end', NaN);
                const filterIdx = safeValue(d, 'filter', -1);
                const names = filterNames[cam];
                const filter = (names && names[filterIdx] !== undefined) ? names[filterIdx] : (filterIdx === -1 ? 'N/A' : filterIdx);
                const ccdTemp = safeValue(d, 'CCD_TEMP', NaN);
                const focName = safeValue(d, 'focuser', '');
                const focPos = safeValue(systemData[focName] || {}, 'FOC_POS', 'N/A');
                // IMGP's fwhm_C1/C2/C3 are only populated by the image
                // processing pipeline when it's actually running - per
                // the site's own report, that stopped happening at some
                // point. No fallback beyond N/A here; fixing the pipeline
                // itself is out of this page's scope.
                const fwhm = safeValue(systemData.IMGP, `fwhm_${cam}`, NaN);

                div.innerHTML = `
                    <div class="status-value">${object || '(idle)'}</div>
                    <div class="status-value">Exp: ${fmt(exposure)} s</div>
                    <div class="status-value">Ends: ${formatTime(exposureEnd)}</div>
                    <div class="status-value">Filter: ${filter}</div>
                    <div class="status-value">FWHM: ${fmt(fwhm, 2)}</div>
                    <div class="status-value">CCD: ${fmt(ccdTemp, 1)}&deg;C</div>
                    <div class="status-value">Focus (${focName}): ${focPos}</div>
                `;
            }
        }

        // Latest per-camera image, via the same external dark+flat
        // correction process D50's monitor.html reads (C{n}_small.jpg/
        // C{n}_center.jpg/C{n}_info.txt, sibling files in this page's own
        // directory - confirmed present on lascaux, not guessed). Plain
        // cache-busted <img> reloads, no rts2ng API/DB call involved at
        // all - much simpler than, and better quality than, driving this
        // off the raw /preview endpoint.
        function reloadCameraImages() {
            const t = new Date().getTime();
            for (const cam of ['C1', 'C2', 'C3']) {
                const c = cam.toLowerCase();
                document.getElementById(c + '-image').src = `${cam}_small.jpg?t=${t}`;
                document.getElementById(c + '-center').src = `${cam}_center.jpg?t=${t}`;
            }
        }

        // The caption needs the same `?t=` cache-buster the <img> reloads
        // above already carry.  Apache serves these files with only
        // Last-Modified/ETag - no Cache-Control - so a plain fetch() is
        // subject to heuristic freshness (~10% of the file's age), and the
        // browser will happily serve a stale C{n}_info.txt without even
        // revalidating.  That bites hardest at the start of a night: the
        // file is then ~15 h old, so the heuristic pins it for over an
        // hour while the pictures next to it refresh every 15 s - exactly
        // the "picture is current but the caption is from last night"
        // report this came from.
        function updateImageInfo() {
            const t = new Date().getTime();
            for (const cam of ['C1', 'C2', 'C3']) {
                const el = document.getElementById(cam.toLowerCase() + '-info');
                fetch(`${cam}_info.txt?t=${t}`)
                    .then(res => res.text())
                    .then(text => { el.textContent = text.trim(); })
                    .catch(() => { el.textContent = ''; });
            }
        }

        function updateWeatherStatus() {
            const div = document.getElementById('weather-status');
            // Both rain sensors, as on D50's page. N/A rather than "No"
            // for a sensor that has never answered.
            const rainStr = (dev, label) => {
                const rain = safeValue(systemData[dev], 'rain', null);
                return rain === null ? `<span class="warn">N/A (${label})</span>`
                    : rain == 1 ? `<span class="error">YES (${label})</span>` : `<span class="good">No (${label})</span>`;
            };

            const tempOut = safeValue(systemData.WEATHER_BART, 'TEMP_OUT', NaN);
            const humOut = safeValue(systemData.WEATHER_BART, 'HUM_OUT', NaN);
            const tempDome = safeValue(systemData.WEATHER_BART, 'TEMP_DOME', NaN);
            const humDome = safeValue(systemData.WEATHER_BART, 'HUM_DOME', NaN);
            const windSpeed = safeValue(systemData.WEATHER_BART, 'WIND_SPEED', NaN);
            const windPeak = safeValue(systemData.WEATHER_BART, 'WIND_SPEED_PEAK', NaN);

            const cloudDiff = safeValue(systemData.CLOUD, 'TEMP_DIFF', NaN);
            const tempAmb = safeValue(systemData.CLOUD, 'TEMP_AMB', NaN);
            const tempSky = safeValue(systemData.CLOUD, 'TEMP_SKY', NaN);
            const heater = safeValue(systemData.CLOUD, 'HEATER', 0) == 1;

            const diskFree = safeValue(systemData.DISK_BART, 'free', NaN);
            const diskFreeGB = typeof diskFree === 'number' ? (diskFree / 1e9).toFixed(1) : diskFree;

            const upsStatus = safeValue(systemData.BARTUPS, 'ups.status', 'N/A');
            const upsLoad = safeValue(systemData.BARTUPS, 'ups.load', NaN);
            const upsCharge = safeValue(systemData.BARTUPS, 'battery.charge', NaN);
            const onBattery = upsStatus !== 'OL';

            div.innerHTML = `
                <div class="status-value"><strong>Rain?:</strong> ${rainStr('RAIN_BART', 'SBT')} | ${rainStr('RAIN_D50', 'D50')}</div>
                <div class="status-value"><strong>Cloud coverage:</strong> ${fmt(cloudDiff)} (${fmt(tempAmb)} - ${fmt(tempSky)})</div>
                <div class="status-value"><strong>Cloud heater:</strong> ${heater ? 'on' : 'off'}</div>
                <div class="status-value"><strong>Wind:</strong> ${fmt(windSpeed)} m/s, peak ${fmt(windPeak)} m/s</div>

                <table class="temp-table">
                    <tr><th></th><th>Out</th><th>Dome</th></tr>
                    <tr><th>Temp [&deg;C]</th><td>${fmt(tempOut)}</td><td>${fmt(tempDome)}</td></tr>
                    <tr><th>Hum [%]</th><td>${fmt(humOut)}</td><td>${fmt(humDome)}</td></tr>
                </table>

                <div class="status-value"><strong>Disk free:</strong> ${diskFreeGB} GB</div>
                <div class="status-value"><strong>UPS:</strong> <span class="${onBattery ? 'error' : 'good'}">${upsStatus}</span> - load ${fmt(upsLoad)}%, charge ${fmt(upsCharge, 0)}%</div>
            `;
        }

        // centrald's full RTS2 protocol state - not a named Value, it's
        // the raw rts2_status_t (status.h), which rts2-httpd includes as
        // a "state" field alongside every device's values. Rendered the
        // way rts2-mon's bottom line renders it (CentralState::getString,
        // base/kernel/src/centralstate.cpp): "bad weather | rain | ...
        // ON night, block exposure", with the parts coloured and the
        // reason centrald logged for bad weather appended.
        function updateServerdStatus() {
            const el = document.getElementById('serverd-status');
            const state = safeValue(systemData.centrald, 'state', NaN);
            if (typeof state !== 'number' || Number.isNaN(state)) {
                el.textContent = 'N/A';
                el.title = '';
                return;
            }
            const parts = [];
            const part = (text, cls) => parts.push(cls ? `<span class="${cls}">${text}</span>` : text);
            // >>> 0: the weather bit is 0x80000000, the sign bit of a JS
            // bitwise result
            if (((state & 0x80000000) >>> 0) !== 0) {
                const reasons = [[0x00100000, 'rain'], [0x00200000, 'wind'],
                    [0x00400000, 'humidity'], [0x00800000, 'cloud']]
                    .filter(([bit]) => state & bit).map(([, name]) => name);
                part(['bad weather', ...reasons].join(' | '), 'error');
            }
            if (state & 0x40000000)
                part('stop', 'error');
            const [onoff, cls] = {
                0x000: ['ON', 'good'],
                0x010: ['STANDBY', 'standby'],
                0x020: ['SOFT OFF', 'error'],
                0x030: ['HARD OFF', 'error'],
            }[state & 0x030];
            const period = ['day', 'evening', 'dusk', 'night', 'dawn', 'morning'][state & 0x00f] || 'unknown';
            const main = `<span class="${cls}">${onoff}</span> ${period}`;
            const blocks = [[0x01000000, 'exposure'], [0x02000000, 'readout'], [0x04000000, 'telescope move']]
                .filter(([bit]) => state & bit).map(([, name]) => `, block ${name}`).join('');
            parts.push(main + blocks);
            el.innerHTML = parts.join(' | ');
            el.title = `0x${(state >>> 0).toString(16)}`;

            const reasonEl = document.getElementById('bad-weather-reason');
            const reason = safeValue(systemData.centrald, 'bad_weather_reason', '');
            const device = safeValue(systemData.centrald, 'bad_weather_device', '');
            if (((state & 0x80000000) >>> 0) !== 0 && reason) {
                reasonEl.textContent = device ? `${device}: ${reason}` : reason;
                reasonEl.style.display = '';
            } else {
                reasonEl.textContent = '';
                reasonEl.style.display = 'none';
            }
        }

        async function updateStatus() {
            await Promise.all([updateAllDeviceData(), loadFilterNames()]);
            updateServerdStatus();
            updateTelescopeStatus();
            updateDomeStatus();
            updateCameraStatus();
            updateWeatherStatus();
            drawSkyChart();
        }

        function reloadWebcams() {
            const t = new Date().getTime();
            for (const cam of WEBCAMS) {
                const el = document.getElementById(`webcam-${cam.id}`);
                // cam.live is absent for cameras with no working stream
                // (Sentinel, AllSky (D65)) - falls through to the
                // regular snapshot below rather than requesting a URL
                // known not to work.
                if (liveWebcams && cam.live) {
                    // Setting an <img> to the same src it already has
                    // is a no-op in every browser (no re-fetch), so
                    // this 15s-interval call doesn't reconnect the
                    // stream - only the initial toggleLive() switch does.
                    el.src = cam.live;
                } else {
                    const src = equalizeWebcams ? cam.smallEq : cam.small;
                    el.src = `${cam.host || '/webcam/'}${src}?t=${t}`;
                }
            }
        }

        function webcamFullSrc(cam) {
            if (liveWebcams && cam.live)
                return cam.live;
            return `${cam.host || '/webcam/'}${equalizeWebcams ? cam.fullEq : cam.full}`;
        }

        // Cloud sensor history, plotted client-side from rts2-httpd's
        // /api/db/records (the series rts2-recordd stores) - the
        // replacement for classic httpd's server-rendered
        // /images/graph/DEVICE/VALUE JPEG this page used to embed, and
        // the "client-side canvas plot fed by a JSON time-series
        // endpoint" the old TODO here asked for. web/static/records.js
        // is the general-purpose version of the same idea; this is the
        // one-sensor cut of it, kept inside the page because these site
        // pages are deliberately standalone single files.
        const CLOUD_DEVICE = 'CLOUD';
        const CLOUD_VALUE = 'TEMP_DIFF';

        // The cloud history lives in D50's database, not this host's:
        // CLOUD is D50's sensor (this page has always shown D50's plot
        // of it), classic httpd recorded it there since 2023, and
        // rts2-recordd continues that same recvals series now. Nothing
        // records it on lascaux, so ${API_BASE} - this host's own
        // rts2-httpd, used by every other panel here - has nothing to
        // serve and answers "no recorded value CLOUD.TEMP_DIFF".
        //
        // /d50 is Apache's proxy to D50's rts2-httpd, so this stays
        // same-origin: an <img> never needed CORS but fetch() does, and
        // the daemon sends no CORS headers. Point this at ${API_BASE}
        // instead if lascaux ever records the sensor itself.
        const CLOUD_API_BASE = '/d50/api';

        let cloudHours = parseFloat(getCookie('cloudHours')) || 8;
        let cloudSeries = null;

        function setCloudRange(hours) {
            cloudHours = hours;
            setCookie('cloudHours', String(hours));
            reloadCloudGraph();
        }

        function updateCloudButtons() {
            for (const b of document.querySelectorAll('#cloud-ranges button'))
                b.classList.toggle('active', parseFloat(b.dataset.hours) === cloudHours);
        }

        async function reloadCloudGraph() {
            const canvas = document.getElementById('cloud-canvas');
            const status = document.getElementById('cloud-status');
            if (!canvas || !status)
                return;
            updateCloudButtons();

            const to = Math.round(new Date().getTime() / 1000);
            const from = Math.round(to - cloudHours * 3600);
            // One point per canvas pixel is all the plot can show; more
            // just makes the response bigger. The daemon buckets the
            // rest away server-side (avg/min/max per bucket).
            const points = Math.max(200, Math.round(canvas.clientWidth || 900));

            try {
                const res = await fetch(`${CLOUD_API_BASE}/db/records?device=${CLOUD_DEVICE}&value=${CLOUD_VALUE}&from=${from}&to=${to}&points=${points}`);
                const data = await res.json();
                if (data.error)
                    throw new Error(data.error);
                cloudSeries = data;
                const last = data.points.length ? data.points[data.points.length - 1] : null;
                if (last) {
                    const age = Math.round(to - last[0]);
                    status.className = 'cloud-status';
                    status.textContent = `${CLOUD_DEVICE}.${CLOUD_VALUE} = ${last[1].toFixed(2)} `
                        + `(${age < 120 ? age + ' s' : Math.round(age / 60) + ' min'} ago), `
                        + `${data.points.length} points over ${cloudHours} h`;
                } else {
                    status.className = 'cloud-status warn';
                    status.textContent = `nothing recorded in the last ${cloudHours} h`;
                }
            } catch (e) {
                cloudSeries = null;
                status.className = 'cloud-status warn';
                status.textContent = `cannot load cloud history: ${e.message}`
                    + ` - is D50's rts2-recordd running and recording ${CLOUD_DEVICE}.${CLOUD_VALUE},`
                    + ` and is ${CLOUD_API_BASE} still proxied to its rts2-httpd?`;
            }
            drawCloudGraph();
        }

        function cloudNiceStep(raw) {
            const exp = Math.pow(10, Math.floor(Math.log10(raw)));
            const norm = raw / exp;
            if (norm <= 1) return exp;
            if (norm <= 2) return 2 * exp;
            if (norm <= 5) return 5 * exp;
            return 10 * exp;
        }

        // Sun altitude at an arbitrary time, for shading the cloud graph
        // by day/twilight/night - the same low-precision ephemeris
        // renderSkyChart() already uses for the Sun marker (julianDate/
        // gmstDeg/sunEquatorial/equToHrz below), just evaluated at any
        // time rather than "now". Cloudmeter readings mean something
        // different in daylight than at night, hence marking which is
        // which rather than adding a new astronomy stack for it.
        function sunAltDeg(t) {
            if (!horizonInfo)
                return null;
            const jd = julianDate(new Date(t * 1000));
            const sun = sunEquatorial(jd);
            const lst = normDeg(gmstDeg(jd) + horizonInfo.lon);
            return equToHrz(lst - sun.ra, sun.dec, horizonInfo.lat).alt;
        }

        // Splits [tMin, tMax] into contiguous {from, to, band} runs of
        // 'day' | 'twilight' | 'night', using the same night_horizon/
        // day_horizon thresholds RTS2 itself classifies night by
        // (/api/horizon) - this is what "night" means to RTS2, not a
        // fixed astronomical-twilight constant. 3-minute sampling: fine
        // enough that even a short twilight near the equator still gets
        // its own band, coarse enough that even a multi-day range is a
        // few hundred trig evaluations.
        function dayNightBands(tMin, tMax) {
            if (!horizonInfo || horizonInfo.nightHorizon === undefined)
                return [];
            const classify = alt => alt > horizonInfo.dayHorizon ? 'day'
                : (alt > horizonInfo.nightHorizon ? 'twilight' : 'night');

            const step = 180;
            const bands = [];
            let segStart = tMin;
            let segClass = classify(sunAltDeg(tMin));
            for (let t = tMin + step; t < tMax; t += step) {
                const cls = classify(sunAltDeg(t));
                if (cls !== segClass) {
                    bands.push({ from: segStart, to: t, band: segClass });
                    segStart = t;
                    segClass = cls;
                }
            }
            bands.push({ from: segStart, to: tMax, band: segClass });
            return bands;
        }

        function drawCloudGraph() {
            const canvas = document.getElementById('cloud-canvas');
            if (!canvas)
                return;
            const ctx = canvas.getContext('2d');
            // backing store in device pixels, box in layout pixels -
            // otherwise the plot is blurry on any HiDPI screen
            const ratio = window.devicePixelRatio || 1;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            canvas.width = Math.round(width * ratio);
            canvas.height = Math.round(height * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.clearRect(0, 0, width, height);

            // colours off the page's own CSS variables, so the plot
            // follows dark mode with everything else
            const style = getComputedStyle(document.body);
            const fg = style.getPropertyValue('--text-muted').trim() || '#555';
            const grid = style.getPropertyValue('--border').trim() || '#ccc';
            const line = style.getPropertyValue('--graph-line').trim() || '#2563eb';
            const band = style.getPropertyValue('--graph-band').trim() || 'rgba(37,99,235,0.18)';
            const dayBg = style.getPropertyValue('--graph-day-bg').trim() || 'rgba(255,190,40,0.12)';
            const twilightBg = style.getPropertyValue('--graph-twilight-bg').trim() || 'rgba(37,99,235,0.08)';

            if (!cloudSeries || !cloudSeries.points.length) {
                ctx.fillStyle = fg;
                ctx.font = '12px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('no data', width / 2, height / 2);
                return;
            }

            const pts = cloudSeries.points;
            const x0 = 44, x1 = width - 8, y0 = 10, y1 = height - 20;
            if (x1 <= x0 || y1 <= y0)
                return;

            const tMin = cloudSeries.from, tMax = cloudSeries.to;
            let vMin = Infinity, vMax = -Infinity;
            for (const p of pts) {
                for (const v of [p[1], p[2], p[3]]) {
                    if (v === null || !isFinite(v)) continue;
                    if (v < vMin) vMin = v;
                    if (v > vMax) vMax = v;
                }
            }
            if (!isFinite(vMin) || !isFinite(vMax)) { vMin = 0; vMax = 1; }
            if (vMin === vMax) { vMin -= 0.5; vMax += 0.5; }
            else { const m = (vMax - vMin) * 0.05; vMin -= m; vMax += m; }

            const sx = t => x0 + (t - tMin) / (tMax - tMin) * (x1 - x0);
            const sy = v => y1 - (v - vMin) / (vMax - vMin) * (y1 - y0);

            // day/twilight/night background, drawn before anything else
            // so grid, band and line all stay fully legible on top of it
            // - night gets no fill at all (unchanged from before this
            // existed), day and twilight get a minimal tint
            for (const seg of dayNightBands(tMin, tMax)) {
                if (seg.band === 'night')
                    continue;
                ctx.fillStyle = seg.band === 'day' ? dayBg : twilightBg;
                ctx.fillRect(sx(seg.from), y0, sx(seg.to) - sx(seg.from), y1 - y0);
            }

            ctx.strokeStyle = grid;
            ctx.fillStyle = fg;
            ctx.lineWidth = 1;
            ctx.font = '10px Arial, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            const yStep = cloudNiceStep((vMax - vMin) / 4);
            for (let v = Math.ceil(vMin / yStep) * yStep; v <= vMax; v += yStep) {
                const y = Math.round(sy(v)) + 0.5;
                ctx.beginPath();
                ctx.moveTo(x0, y);
                ctx.lineTo(x1, y);
                ctx.stroke();
                // decimals from the step, not a fixed guess: a clear
                // night's TEMP_DIFF can move by 0.05 between gridlines,
                // and one decimal prints every one of them as "9.2"
                const dec = Math.max(0, Math.min(4, Math.ceil(-Math.log10(yStep))));
                ctx.fillText(v.toFixed(dec), x0 - 6, y);
            }

            ctx.textBaseline = 'top';
            const xStep = cloudNiceStep((tMax - tMin) / 6);
            for (let t = Math.ceil(tMin / xStep) * xStep; t <= tMax; t += xStep) {
                const x = Math.round(sx(t)) + 0.5;
                ctx.beginPath();
                ctx.moveTo(x, y0);
                ctx.lineTo(x, y1);
                ctx.stroke();
                const d = new Date(t * 1000);
                const label = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
                // the outermost labels are aligned inwards, or they hang
                // off the canvas and get clipped mid-digit
                const half = ctx.measureText(label).width / 2;
                ctx.textAlign = x + half > width ? 'right' : (x - half < 0 ? 'left' : 'center');
                ctx.fillText(label, x, y1 + 4);
            }

            // spread inside each bucket, where the range was downsampled
            if (pts.some(p => p[4] > 1)) {
                ctx.fillStyle = band;
                ctx.beginPath();
                let started = false;
                for (const p of pts) {
                    if (p[3] === null || !isFinite(p[3])) continue;
                    const x = sx(p[0]), y = sy(p[3]);
                    started ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                    started = true;
                }
                for (let i = pts.length - 1; i >= 0; i--) {
                    const p = pts[i];
                    if (p[2] === null || !isFinite(p[2])) continue;
                    ctx.lineTo(sx(p[0]), sy(p[2]));
                }
                ctx.closePath();
                ctx.fill();
            }

            // a gap in the data stays a gap rather than being bridged by
            // a line nobody measured
            ctx.strokeStyle = line;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            let pen = false;
            for (const p of pts) {
                if (p[1] === null || !isFinite(p[1])) { pen = false; continue; }
                const x = sx(p[0]), y = sy(p[1]);
                pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                pen = true;
            }
            ctx.stroke();
        }

        let cloudGraphResizeTimer = null;
        window.addEventListener('resize', () => {
            // refetch, not just redraw: how many points are worth asking
            // for depends on the panel's width
            clearTimeout(cloudGraphResizeTimer);
            cloudGraphResizeTimer = setTimeout(reloadCloudGraph, 300);
        });

        function toggleEqualize() {

        // Preferences (dark/compact/equalize mode), persisted via cookie
        // so they survive a reload - this page has no backend of its
        // own to store per-user settings in.
        function setCookie(name, value) {
            document.cookie = `${name}=${value};path=/;max-age=31536000;samesite=lax`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return match ? match[1] : null;
        }

        // Sentinel's LED light hangs on the camera's digital output 1
        // (Vivotek dido CGIs), switched through lascaux's
        // /observ/sentinel/ proxy, same-origin, so the visitor's /observ
        // login is what guards it. Apache swaps in a camera account
        // allowed to set the output (the stream's viewer account gets
        // 401 here). Same as d50-monitor.html's Sentinel50.
        const SENTINEL_DIDO = '/observ/sentinel/cgi-bin/dido/';

        async function sentinelDido(cgi) {
            const resp = await fetch(SENTINEL_DIDO + cgi, { cache: 'no-store' });
            if (!resp.ok)
                throw new Error(`HTTP ${resp.status}`);
            return resp.text();
        }

        // The camera answers "do1=0" or "do1=1". null: not known.
        let sentinelLedOn = null;

        function showSentinelLed(text, err) {
            const m = text ? text.match(/do1\s*=\s*([01])/) : null;
            sentinelLedOn = m ? m[1] === '1' : null;
            const btn = document.getElementById('led-btn');
            btn.classList.toggle('on', sentinelLedOn === true);
            btn.textContent = sentinelLedOn === null ? 'LED light ?' : 'LED light';
            btn.title = "Sentinel's LED light, for the cameras inside";
            if (sentinelLedOn === null)
                btn.title += ` - state not known: ${err ? err.message : `unexpected reply: ${text}`}`;
        }

        async function updateSentinelLed() {
            try {
                showSentinelLed(await sentinelDido('getdo.cgi?do1'));
            } catch (e) {
                showSentinelLed(null, e);
            }
        }

        // Unknown state switches it on.
        async function toggleSentinelLed() {
            try {
                await sentinelDido(`setdo.cgi?do1=${sentinelLedOn ? 0 : 1}`);
            } catch (e) {
                showSentinelLed(null, e);
                return;
            }
            updateSentinelLed();
        }
