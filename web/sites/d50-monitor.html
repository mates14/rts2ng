                    if (p[3] === null || !isFinite(p[3])) continue;
                    const x = sx(p[0]), y = sy(p[3]);
                    started ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                    started = true;
                }
                for (let i = pts.length - 1; i >= 0; i--) {
                    const p = pts[i];
                    if (p[2] === null || !isFinite(p[2])) continue;
                    ctx.lineTo(sx(p[0]), sy(p[2]));
                }
                ctx.closePath();
                ctx.fill();
            }

            // a gap in the data stays a gap rather than being bridged by
            // a line nobody measured
            ctx.strokeStyle = line;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            let pen = false;
            for (const p of pts) {
                if (p[1] === null || !isFinite(p[1])) { pen = false; continue; }
                const x = sx(p[0]), y = sy(p[1]);
                pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                pen = true;
            }
            ctx.stroke();
        }

        // --- Guiding (C1) --------------------------------------------------
        // The guide script (/etc/rts2/guide.py) publishes its own numbers
        // on the guide camera - guide_dx/guide_dy (pixels), the pulses it
        // sent, how many stars it matched, the FWHM of the star it
        // measured, guide_scale to turn any of that into arcsec, and
        // guide_last_image naming the frame it kept. That makes the live
        // half of this panel a plain value read: no database, no image
        // pipeline, nothing to go stale behind the page's back. NaN on
        // the bus arrives here as null (rts2-httpd sends no `nan` token,
        // which JSON has no room for), and null means "not guiding" -
        // never "same as last time".
        const GUIDE_CAM = 'C1';
        const GUIDE_LIVE_SECONDS = 300;
        const GUIDE_FRESH_SECONDS = 20;  // a guiding cycle is about 2 s

        // What C1 is doing when it is not guiding, from its state word
        // (base/kernel/include/status.h): exposing 0x011, reading 0x002,
        // hardware error 0x20000.
        function describeGuideCam(d) {
            const st = numOrNull(d.state);
            if (st === null)
                return `${GUIDE_CAM}: state unknown`;
            if (st & 0x00020000)
                return `${GUIDE_CAM} reports a hardware error`;
            if (st & 0x011)
                return `${GUIDE_CAM} is exposing`;
            if (st & 0x002)
                return `${GUIDE_CAM} is reading out`;
            return `${GUIDE_CAM} is idle`;
        }

        let guideLive = [];              // {t, dx, dy, fwhm, n} for the last 5 min
        let guideLastImage = null;
        let guideScale = null;           // arcsec/pixel, as published by the camera
        let guideActive = false;
        let guideHistory = null;         // {dx: series, dy: series} from /api/db/records
        let guideHours = parseFloat(getCookie('guideHours')) || 8;

        function numOrNull(v) {
            return typeof v === 'number' && isFinite(v) ? v : null;
        }

        function setGuideRange(hours) {
            guideHours = hours;
            setCookie('guideHours', String(hours));
            reloadGuideHistory();
        }

        function updateGuideButtons() {
            for (const b of document.querySelectorAll('#guide-ranges button'))
                b.classList.toggle('active', parseFloat(b.dataset.hours) === guideHours);
        }

        async function pollGuide() {
            const data = await fetchDeviceData(GUIDE_CAM);
            const status = document.getElementById('guide-status');
            if (!data) {
                status.className = 'cloud-status warn';
                status.textContent = `cannot reach ${GUIDE_CAM}`;
                return;
            }
            systemData[GUIDE_CAM] = data;

            if (data.guide_dx === undefined) {
                // The camera is there but carries no guiding values at
                // all - the script that creates them has not run yet
                // (they appear on its first exposure and stay for the
                // rest of the session), or it is an older copy of it.
                status.className = 'cloud-status warn';
                status.textContent = `${GUIDE_CAM} publishes no guiding telemetry`
                    + ' - guide.py creates guide_dx/guide_dy/... on its first frame';
                guideActive = false;
                return;
            }

            guideScale = numOrNull(data.guide_scale) || guideScale;

            // guide.py publishes guide_time and guide_state since 2026-10-24:
            // then guiding means a recent guide_time (a script RTS2 ends
            // cannot reset its values any more). An older guide.py has
            // neither, and values being there is all there is to go by.
            const now = Date.now() / 1000;
            const hasTime = data.guide_time !== undefined;
            const gt = numOrNull(data.guide_time);
            const fresh = gt !== null && now - gt < GUIDE_FRESH_SECONDS;
            const state = typeof data.guide_state === 'string' ? data.guide_state : '';
            const sample = (hasTime && !fresh) ? { t: now, dx: null, dy: null, fwhm: null, n: null } : {
                t: now,
                dx: numOrNull(data.guide_dx),
                dy: numOrNull(data.guide_dy),
                fwhm: numOrNull(data.guide_fwhm),
                n: numOrNull(data.guide_stars)
            };
            guideActive = hasTime ? fresh : (sample.dx !== null || sample.dy !== null);
            guideLive.push(sample);
            while (guideLive.length && guideLive[0].t < now - GUIDE_LIVE_SECONDS)
                guideLive.shift();

            // The cutout is rendered by the guide script itself, using the
            // stretch pyrt-f2cj fitted for this field, and dropped beside the
            // C0 preview for Apache to serve.  Deliberately not /preview/:
            // that endpoint has no histogram case for signed short, so it
            // scales the guide cutouts to a flat grey.  guide_last_image
            // still drives the reload - it names the FITS this JPEG was made
            // from, and changes exactly once per kept frame.
            const path = typeof data.guide_last_image === 'string' ? data.guide_last_image : '';
            if (path && path !== guideLastImage) {
                guideLastImage = path;
                const url = `guide_last.jpg?t=${Date.now()}`;
                document.getElementById('guide-frame-img').src = url;
                document.getElementById('guide-frame-img').onclick =
                    () => openLightbox(url, `${GUIDE_CAM} - ${path.split('/').pop()}`);
            }

            const img = document.getElementById('guide-frame-img');
            img.classList.toggle('dim', !guideActive);

            status.className = state === 'star lost' && guideActive ? 'cloud-status warn' : 'cloud-status';
            if (guideActive && (!hasTime || state === 'guiding' || !state))
                status.textContent = `guiding, ${guideLive.filter(p => p.dx !== null).length} samples in the last`
                    + ` ${Math.round(GUIDE_LIVE_SECONDS / 60)} min`;
            else if (guideActive)
                status.textContent = state === 'acquiring' ? 'acquiring the reference frame'
                    : state === 'star lost' ? 'no stars in the guiding frame - retrying' : state;
            else
                status.textContent = `not guiding - ${describeGuideCam(data)}`
                    + (gt !== null ? `; last guided ${hhmmss(gt * 1000)}` : '');

            updateGuideReadout(data);
            drawGuideLive();
            drawGuideScatter();
        }

        // Self-rescheduling rather than setInterval: guiding runs at
        // about 1 Hz and is worth following at that rate, but between
        // observations there is nothing to follow and no reason to ask
        // the daemon every second.
        function guideLoop() {
            pollGuide()
                .catch(e => console.error(e))
                .finally(() => setTimeout(guideLoop, netMode === 'low' ? 30000 : netMode === 'idle' ? 60000 : guideActive ? 1000 : 5000));
        }

        function guideStats() {
            const pts = guideLive.filter(p => p.dx !== null && p.dy !== null);
            if (!pts.length)
                return null;
            const rms = key => Math.sqrt(pts.reduce((a, p) => a + p[key] * p[key], 0) / pts.length);
            const mean = key => pts.reduce((a, p) => a + p[key], 0) / pts.length;
            const fwhms = guideLive.map(p => p.fwhm).filter(v => v !== null).sort((a, b) => a - b);
            return {
                last: pts[pts.length - 1],
                rmsX: rms('dx'), rmsY: rms('dy'),
                meanX: mean('dx'), meanY: mean('dy'),
                fwhm: fwhms.length ? fwhms[Math.floor(fwhms.length / 2)] : null,
                count: pts.length
            };
        }

        // Pixels are what the script measures; arcsec is what anyone
        // reading this actually wants, and the conversion is the
        // camera's own guide_scale rather than a copy of the constant
        // kept here - one number, defined in one place.
        function guideArcsec(px, digits = 2) {
            return guideScale && px !== null ? ` (${(px * guideScale).toFixed(digits)}")` : '';
        }

        function guideArcsecPair(x, y, digits = 2) {
            return guideScale ? ` (${(x * guideScale).toFixed(digits)}"`
                + ` / ${(y * guideScale).toFixed(digits)}")` : '';
        }

        function updateGuideReadout(data) {
            const el = document.getElementById('guide-readout');
            const st = guideStats();
            if (!guideActive) {
                el.innerHTML = '<span class="big">not guiding</span><br>' + describeGuideCam(data || {})
                    + (st ? `<br>last ${Math.round(GUIDE_LIVE_SECONDS / 60)} min: RMS`
                        + ` ${st.rmsX.toFixed(2)} / ${st.rmsY.toFixed(2)} px` : '');
                return;
            }
            // the guiding state first, as SBT's page shows it: guide.py's
            // guide_state, or plain "guiding" from an older guide.py
            const gstate = data && typeof data.guide_state === 'string' && data.guide_state
                ? data.guide_state : 'guiding';
            const stateLine = `<span class="big ${gstate === 'star lost' ? 'warn' : (gstate === 'guiding' ? 'good' : '')}">`
                + `${gstate}</span><br>`;
            if (!st) {
                el.innerHTML = stateLine + 'no guiding errors measured yet';
                return;
            }
            const stars = st.last.n === null ? 'N/A' : st.last.n.toFixed(0);
            const lost = st.last.n !== null && st.last.n < 1;
            const pra = data ? numOrNull(data.guide_pulse_ra) : null;
            const pdec = data ? numOrNull(data.guide_pulse_dec) : null;
            const pulses = pra === null || pdec === null ? 'N/A' : `${pra.toFixed(0)} / ${pdec.toFixed(0)} ms`;
            el.innerHTML = stateLine + `
                <span class="big">${st.last.dx.toFixed(2)} / ${st.last.dy.toFixed(2)} px</span>
                ${guideArcsecPair(st.last.dx, st.last.dy)}<br>
                RMS ${st.rmsX.toFixed(2)} / ${st.rmsY.toFixed(2)} px over ${st.count} samples<br>
                mean ${st.meanX.toFixed(2)} / ${st.meanY.toFixed(2)} px<br>
                FWHM <span class="big">${st.fwhm === null ? 'N/A' : st.fwhm.toFixed(2) + ' px'}</span>
                ${guideArcsec(st.fwhm)}<br>
                pulses RA / Dec ${pulses}<br>
                stars matched <span class="${lost ? 'big warn' : ''}">${stars}</span>
            `;
        }

        // Canvas boilerplate the three guiding plots share: backing store
        // in device pixels, drawing in layout pixels, palette off the
        // page's own CSS variables so everything follows dark mode.
        function guideCanvas(id) {
            const canvas = document.getElementById(id);
            if (!canvas || !canvas.clientWidth)
                return null;
            const ctx = canvas.getContext('2d');
            const ratio = window.devicePixelRatio || 1;
            const width = canvas.clientWidth, height = canvas.clientHeight;
            canvas.width = Math.round(width * ratio);
            canvas.height = Math.round(height * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.clearRect(0, 0, width, height);
            const style = getComputedStyle(document.body);
            return {
                ctx, width, height,
                fg: style.getPropertyValue('--text-muted').trim() || '#555',
                grid: style.getPropertyValue('--border').trim() || '#ccc',
                x: style.getPropertyValue('--graph-line').trim() || '#2563eb',
                y: style.getPropertyValue('--graph-line2').trim() || '#d97706',
                band: style.getPropertyValue('--graph-band').trim() || 'rgba(37,99,235,0.18)'
            };
        }

        function guideNoData(c, text) {
            c.ctx.fillStyle = c.fg;
            c.ctx.font = '12px Arial, sans-serif';
            c.ctx.textAlign = 'center';
            c.ctx.textBaseline = 'middle';
            c.ctx.fillText(text, c.width / 2, c.height / 2);
        }

        function drawGuideLive() {
            const c = guideCanvas('guide-live');
            if (!c)
                return;
            const now = Date.now() / 1000;
            const tMin = now - GUIDE_LIVE_SECONDS, tMax = now;
            const x0 = 34, x1 = c.width - 8, y0 = 8, y1 = c.height - 18;
            if (x1 <= x0 || y1 <= y0)
                return;

            // Symmetric around zero and never tighter than +-2 px: a
            // quiet night must look quiet, not get magnified into noise
            // filling the whole panel.
            let span = 2;
            for (const p of guideLive) {
                for (const v of [p.dx, p.dy])
                    if (v !== null) span = Math.max(span, Math.abs(v) * 1.15);
            }
            const sx = t => x0 + (t - tMin) / (tMax - tMin) * (x1 - x0);
            const sy = v => (y0 + y1) / 2 - v / span * (y1 - y0) / 2;

            c.ctx.strokeStyle = c.grid;
            c.ctx.fillStyle = c.fg;
            c.ctx.lineWidth = 1;
            c.ctx.font = '10px Arial, sans-serif';
            c.ctx.textAlign = 'right';
            c.ctx.textBaseline = 'middle';
            const step = cloudNiceStep(span / 2);
            for (let v = -Math.floor(span / step) * step; v <= span; v += step) {
                const y = Math.round(sy(v)) + 0.5;
                c.ctx.beginPath();
                c.ctx.moveTo(x0, y);
                c.ctx.lineTo(x1, y);
                c.ctx.stroke();
                c.ctx.fillText(v.toFixed(Math.max(0, Math.min(2, Math.ceil(-Math.log10(step))))), x0 - 5, y);
            }

            c.ctx.textAlign = 'center';
            c.ctx.textBaseline = 'top';
            for (let m = 0; m <= GUIDE_LIVE_SECONDS / 60; m++) {
                const x = Math.round(sx(now - m * 60)) + 0.5;
                c.ctx.beginPath();
                c.ctx.moveTo(x, y0);
                c.ctx.lineTo(x, y1);
                c.ctx.stroke();
                c.ctx.fillText(m ? `-${m}m` : 'now', x, y1 + 4);
            }

            if (!guideLive.some(p => p.dx !== null)) {
                guideNoData(c, 'not guiding');
                return;
            }

            // A pause in guiding is a gap, not a straight line drawn
            // across it - same rule the cloud plot follows, and the
            // reason the script publishes NaN when it stops.
            for (const key of ['dx', 'dy']) {
                c.ctx.strokeStyle = key === 'dx' ? c.x : c.y;
                c.ctx.lineWidth = 1.2;
                c.ctx.beginPath();
                let pen = false, lastT = 0;
                for (const p of guideLive) {
                    if (p[key] === null || p.t - lastT > 5) pen = false;
                    if (p[key] === null) continue;
                    const px = sx(p.t), py = sy(Math.max(-span, Math.min(span, p[key])));
                    pen ? c.ctx.lineTo(px, py) : c.ctx.moveTo(px, py);
                    pen = true;
                    lastT = p.t;
                }
                c.ctx.stroke();
            }

            c.ctx.textAlign = 'left';
            c.ctx.textBaseline = 'top';
            c.ctx.fillStyle = c.x;
            c.ctx.fillText('dx', x0 + 4, y0 + 1);
            c.ctx.fillStyle = c.y;
            c.ctx.fillText('dy', x0 + 22, y0 + 1);
        }

        // Where the errors sit relative to each other, oldest faintest:
        // a cloud around the origin is good guiding, a cloud somewhere
        // else is a systematic pull, and a smear is drift.
        function drawGuideScatter() {
            const c = guideCanvas('guide-scatter');
            if (!c)
                return;
            const pts = guideLive.filter(p => p.dx !== null && p.dy !== null);
            const size = Math.min(c.width, c.height);
            const cx = c.width / 2, cy = c.height / 2;
            let span = 2;
            for (const p of pts)
                span = Math.max(span, Math.abs(p.dx) * 1.15, Math.abs(p.dy) * 1.15);
            const scale = (size / 2 - 14) / span;

            c.ctx.strokeStyle = c.grid;
            c.ctx.fillStyle = c.fg;
            c.ctx.font = '10px Arial, sans-serif';
            c.ctx.lineWidth = 1;
            const ring = cloudNiceStep(span / 2);
            for (let r = ring; r <= span; r += ring) {
                c.ctx.beginPath();
                c.ctx.arc(cx, cy, r * scale, 0, 2 * Math.PI);
                c.ctx.stroke();
                if (cx + r * scale + 22 < c.width) {
                    c.ctx.textAlign = 'left';
                    c.ctx.textBaseline = 'bottom';
                    c.ctx.fillText(r.toFixed(1), cx + r * scale + 2, cy);
                }
            }
            c.ctx.beginPath();
            c.ctx.moveTo(cx - size / 2, cy); c.ctx.lineTo(cx + size / 2, cy);
            c.ctx.moveTo(cx, cy - size / 2); c.ctx.lineTo(cx, cy + size / 2);
            c.ctx.stroke();

            if (!pts.length) {
                guideNoData(c, 'not guiding');
                return;
            }

            const now = Date.now() / 1000;
            for (const p of pts) {
                const age = (now - p.t) / GUIDE_LIVE_SECONDS;
                c.ctx.globalAlpha = Math.max(0.08, 1 - age);
                c.ctx.fillStyle = c.x;
                c.ctx.beginPath();
                c.ctx.arc(cx + p.dx * scale, cy - p.dy * scale, age < 0.02 ? 3.5 : 1.8, 0, 2 * Math.PI);
                c.ctx.fill();
            }
            c.ctx.globalAlpha = 1;
            c.ctx.fillStyle = c.fg;
            c.ctx.textAlign = 'left';
            c.ctx.textBaseline = 'top';
            c.ctx.fillText('dx / dy [px], newest brightest', 4, 3);
        }

        // The night behind the live view: the same two values after
        // rts2-recordd has sampled them into the database. One request
        // per series - /api/db/records answers for one value at a time,
        // and buckets to avg/min/max server-side so a whole night still
        // arrives as one point per pixel column.
        async function reloadGuideHistory() {
            const canvas = document.getElementById('guide-history');
            if (!canvas)
                return;
            updateGuideButtons();
            const to = Math.round(Date.now() / 1000);
            const from = Math.round(to - guideHours * 3600);
            const points = Math.max(200, Math.round(canvas.clientWidth || 900));
            try {
                const series = await Promise.all(['guide_dx', 'guide_dy'].map(async name => {
                    const res = await fetch(`${API_BASE}/db/records?device=${GUIDE_CAM}`
                        + `&value=${name}&from=${from}&to=${to}&points=${points}`);
                    const data = await res.json();
                    if (data.error)
                        throw new Error(data.error);
                    return data;
                }));
                guideHistory = { from, to, bucket: (to - from) / points, dx: series[0], dy: series[1] };
            } catch (e) {
                guideHistory = { from, to, error: String(e.message || e) };
            }
            drawGuideHistory();
        }

        function drawGuideHistory() {
            const c = guideCanvas('guide-history');
            if (!c)
                return;
            if (!guideHistory) {
                guideNoData(c, 'loading...');
                return;
            }
            if (guideHistory.error) {
                guideNoData(c, `no guiding history: ${guideHistory.error}`
                    + ' - is rts2-recordd recording C1.guide_dx?');
                return;
            }

            const x0 = 34, x1 = c.width - 8, y0 = 8, y1 = c.height - 18;
            if (x1 <= x0 || y1 <= y0)
                return;
            const tMin = guideHistory.from, tMax = guideHistory.to;

            let span = 2;
            for (const s of [guideHistory.dx, guideHistory.dy]) {
                for (const p of s.points)
                    for (const v of [p[2], p[3]])
                        if (v !== null && isFinite(v)) span = Math.max(span, Math.abs(v) * 1.1);
            }
            const sx = t => x0 + (t - tMin) / (tMax - tMin) * (x1 - x0);
            const sy = v => (y0 + y1) / 2 - v / span * (y1 - y0) / 2;

            for (const seg of dayNightBands(tMin, tMax)) {
                if (seg.band === 'night')
                    continue;
                const style = getComputedStyle(document.body);
                c.ctx.fillStyle = seg.band === 'day'
                    ? (style.getPropertyValue('--graph-day-bg').trim() || 'rgba(255,190,40,0.12)')
                    : (style.getPropertyValue('--graph-twilight-bg').trim() || 'rgba(37,99,235,0.08)');
                c.ctx.fillRect(sx(seg.from), y0, sx(seg.to) - sx(seg.from), y1 - y0);
            }

            c.ctx.strokeStyle = c.grid;
            c.ctx.fillStyle = c.fg;
            c.ctx.lineWidth = 1;
            c.ctx.font = '10px Arial, sans-serif';
            c.ctx.textAlign = 'right';
            c.ctx.textBaseline = 'middle';
            const step = cloudNiceStep(span / 2);
            for (let v = -Math.floor(span / step) * step; v <= span; v += step) {
                const y = Math.round(sy(v)) + 0.5;
                c.ctx.beginPath();
                c.ctx.moveTo(x0, y);
                c.ctx.lineTo(x1, y);
                c.ctx.stroke();
                c.ctx.fillText(v.toFixed(Math.max(0, Math.min(2, Math.ceil(-Math.log10(step))))), x0 - 5, y);
            }

            c.ctx.textBaseline = 'top';
            const xStep = cloudNiceStep((tMax - tMin) / 6);
            for (let t = Math.ceil(tMin / xStep) * xStep; t <= tMax; t += xStep) {
                const x = Math.round(sx(t)) + 0.5;
                c.ctx.beginPath();
                c.ctx.moveTo(x, y0);
                c.ctx.lineTo(x, y1);
                c.ctx.stroke();
                const d = new Date(t * 1000);
                const label = String(d.getHours()).padStart(2, '0') + ':'
                    + String(d.getMinutes()).padStart(2, '0');
                const half = c.ctx.measureText(label).width / 2;
                c.ctx.textAlign = x + half > c.width ? 'right' : (x - half < 0 ? 'left' : 'center');
                c.ctx.fillText(label, x, y1 + 4);
            }

            // /api/db/records leaves empty buckets out, so a pause in
            // guiding arrives as a jump in time, not as a null - break the
            // line there instead of drawing straight across it
            const maxGap = 3 * guideHistory.bucket;
            let any = false;
            for (const [key, colour] of [['dx', c.x], ['dy', c.y]]) {
                const pts = guideHistory[key].points;
                c.ctx.strokeStyle = colour;
                c.ctx.lineWidth = 1.2;
                c.ctx.beginPath();
                let pen = false, lastT = -Infinity;
                for (const p of pts) {
                    if (p[1] === null || !isFinite(p[1])) { pen = false; continue; }
                    if (p[0] - lastT > maxGap) pen = false;
                    lastT = p[0];
                    any = true;
                    const px = sx(p[0]), py = sy(Math.max(-span, Math.min(span, p[1])));
                    pen ? c.ctx.lineTo(px, py) : c.ctx.moveTo(px, py);
                    pen = true;
                }
                c.ctx.stroke();
            }

            if (!any)
                guideNoData(c, `nothing recorded in the last ${guideHours} h`);
        }

        let cloudGraphResizeTimer = null;
        window.addEventListener('resize', () => {
            // refetch, not just redraw: how many points are worth asking
            // for depends on the panel's width
            clearTimeout(cloudGraphResizeTimer);
            cloudGraphResizeTimer = setTimeout(() => {
                reloadCloudGraph();
                reloadGuideHistory();
                drawGuideLive();
                drawGuideScatter();
            }, 300);
        });

        function toggleEqualize() {
            equalizeWebcams = !equalizeWebcams;
            setCookie('equalizeWebcams', equalizeWebcams ? '1' : '0');
            document.getElementById('equalize-btn').classList.toggle('active', equalizeWebcams);
            reloadWebcams();
        }

        function openArchive() {
            window.open('/images/', '_blank');
        }

        // Preferences (dark/compact/equalize mode), persisted via cookie
        // so they survive a reload - this page has no backend of its own
        // to store per-user settings in.
        function setCookie(name, value) {
            document.cookie = `${name}=${value};path=/;max-age=31536000;samesite=lax`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return match ? match[1] : null;
        }

        let equalizeWebcams = getCookie('equalizeWebcams') === '1';
        // Live streams are not a preference: they switch back to
        // snapshots after LIVE_MS, so a page left open does not pull
        // the streams all night. The cookie holds the time they end
        // (ms), so a reload meanwhile keeps the rest of the time.
        const LIVE_MS = 10 * 60 * 1000;
        let liveUntil = Number(getCookie('liveWebcamsUntil')) || 0;
        let liveWebcams = liveUntil > Date.now();
        let liveTimer = null;
        let lightboxLive = false;        // the lightbox shows a live stream

        function setLive(on) {
            liveWebcams = on;
            if (on && !(liveUntil > Date.now()))
                liveUntil = Date.now() + LIVE_MS;
            else if (!on)
                liveUntil = 0;
            setCookie('liveWebcamsUntil', liveUntil);
            clearTimeout(liveTimer);
            liveTimer = on ? setTimeout(() => setLive(false), liveUntil - Date.now()) : null;
            const btn = document.getElementById('live-btn');
            btn.classList.toggle('active', liveWebcams);
            btn.title = liveWebcams
                ? `live streams until ${new Date(liveUntil).toLocaleTimeString()}, then snapshots again`
                : `live streams for ${LIVE_MS / 60000} min`;
            if (!on && lightboxLive)
                closeLightbox();
            reloadWebcams();
        }

        function toggleLive() {
            if (liveWebcams)
                liveUntil = 0;
            setLive(!liveWebcams);
        }

        // Sentinel50's LED light hangs on the camera's digital output 1
        // (Vivotek dido CGIs). The old PHP page switched it with a link
        // carrying the camera's login in the URL (user:pass@host), which
        // browsers no longer follow. Now it goes through lascaux50's
        // /observ/sentinel50/ proxy, same-origin, so the visitor's
        // /observ login is what guards it. Apache swaps in a camera
        // account allowed to set the output; the stream's viewer account
        // gets 401 here. web/STATUS.md has the Apache snippet.
        const SENTINEL_DIDO = '/observ/sentinel50/cgi-bin/dido/';

        async function sentinelDido(cgi) {
            const resp = await fetch(SENTINEL_DIDO + cgi, { cache: 'no-store' });
            if (!resp.ok)
                throw new Error(`HTTP ${resp.status}`);
            return resp.text();
        }

        // The camera answers "do1=0" or "do1=1". null: not known.
        let sentinelLedOn = null;

        function showSentinelLed(text, err) {
            const m = text ? text.match(/do1\s*=\s*([01])/) : null;
            sentinelLedOn = m ? m[1] === '1' : null;
            const btn = document.getElementById('led-btn');
            btn.classList.toggle('on', sentinelLedOn === true);
            btn.textContent = sentinelLedOn === null ? 'LED light ?' : 'LED light';
            btn.title = "Sentinel50's LED light, for the cameras inside";
            if (sentinelLedOn === null)
                btn.title += ` - state not known: ${err ? err.message : `unexpected reply: ${text}`}`;
        }

        async function updateSentinelLed() {
            try {
                showSentinelLed(await sentinelDido('getdo.cgi?do1'));
            } catch (e) {
                showSentinelLed(null, e);
            }
        }

        // Unknown state switches it on.
        async function toggleSentinelLed() {
            try {
                await sentinelDido(`setdo.cgi?do1=${sentinelLedOn ? 0 : 1}`);
            } catch (e) {
                showSentinelLed(null, e);
                return;
            }
            updateSentinelLed();
        }

        function toggleDarkMode() {
            const on = document.body.classList.toggle('dark');
            setCookie('darkMode', on ? '1' : '0');
            // The sky chart picks its palette off body.dark itself
            // rather than the --variables everything else uses, so it
            // needs an explicit redraw.
            drawSkyChart();
        }

        function toggleCompactMode() {
            const on = document.body.classList.toggle('compact');
            setCookie('compactMode', on ? '1' : '0');
            reloadCloudGraph();
        }

        // System-wide on/standby/off - queues centrald's raw "on"/
        // "standby"/"off" text command via /api/switchstate. Fire-and-
        // forget, same as /api/set - the next 10s status poll reflects
        // the new state once devices ack it.
        async function switchState(state) {
            const msg = document.getElementById('state-msg');
            msg.textContent = `sending ${state}...`;
            msg.className = 'status-value';
            try {
                const res = await fetch(`${API_BASE}/switchstate?state=${state}`);
                if (res.status === 401) {
                    msg.textContent = 'not authorized (login required for this action)';
                    msg.className = 'status-value error';
                    return;
                }
                if (!res.ok)
                    throw new Error(`${res.status}`);
                msg.textContent = `sent "${state}" to centrald`;
                msg.className = 'status-value good';
                updateStatus().catch(e => console.error(e));
            } catch (e) {
                msg.textContent = `failed to send "${state}": ${e}`;
                msg.className = 'status-value error';
            }
        }

        // Sky chart: alt-az plot with horizon, bright stars, Sun, Moon,
        // and the telescope's current/target position. Identical to
        // bart-monitor.html's implementation - site geometry (observer
        // lat/lon, horizon polygon) comes from this daemon's own
        // /api/horizon, so it automatically reflects D50's real location
        // and horizon file with no changes needed here at all.
        //
        // Azimuth convention throughout matches libnova's: 0=South,
        // 90=West, 180=North, 270=East - not compass convention.
        // Converted to a North-up, East-right screen layout (like a map)
        // only at the final projection step.
        let horizonInfo = null;
        let starCatalog = null;

        async function loadHorizonInfo() {
            try {
                const res = await fetch(`${API_BASE}/horizon`);
                if (res.ok)
                    horizonInfo = await res.json();
            } catch (e) {
                console.error('Failed to load horizon info:', e);
            }
        }

        async function loadStarCatalog() {
            try {
                const res = await fetch('bsc-stars.json');
                if (res.ok)
                    starCatalog = await res.json();
            } catch (e) {
                console.error('Failed to load star catalog:', e);
            }
        }

        function normDeg(deg) {
            deg = deg % 360;
            return deg < 0 ? deg + 360 : deg;
        }

        function julianDate(date) {
            return date.getTime() / 86400000 + 2440587.5;
        }

        // Greenwich Mean Sidereal Time, in degrees.
        function gmstDeg(jd) {
            const T = (jd - 2451545.0) / 36525.0;
            return normDeg(280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - T * T * T / 38710000.0);
        }

        // Standard low-precision Sun position (US Naval Observatory /
        // Astronomical Almanac formula, ~0.01deg accuracy). Equatorial
        // coordinates, degrees.
        function sunEquatorial(jd) {
            const d = jd - 2451545.0;
            const g = normDeg(357.529 + 0.98560028 * d) * Math.PI / 180;
            const q = normDeg(280.459 + 0.98564736 * d);
            const L = normDeg(q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * Math.PI / 180;
            const e = (23.439 - 0.00000036 * d) * Math.PI / 180;
            const ra = normDeg(Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) * 180 / Math.PI);
            const dec = Math.asin(Math.sin(e) * Math.sin(L)) * 180 / Math.PI;
            return { ra, dec };
        }

        // Standard low-precision Moon position (main terms only,
        // ~0.3-1deg accuracy).
        function moonEquatorial(jd) {
            const d = jd - 2451545.0;
            const L = normDeg(218.316 + 13.176396 * d) * Math.PI / 180;
            const M = normDeg(134.963 + 13.064993 * d) * Math.PI / 180;
            const F = normDeg(93.272 + 13.229350 * d) * Math.PI / 180;
            const lam = L + 6.289 * Math.PI / 180 * Math.sin(M);
            const bet = 5.128 * Math.PI / 180 * Math.sin(F);
            const e = (23.439 - 0.0000004 * d) * Math.PI / 180;
            const ra = normDeg(Math.atan2(Math.sin(lam) * Math.cos(e) - Math.tan(bet) * Math.sin(e), Math.cos(lam)) * 180 / Math.PI);
            const dec = Math.asin(Math.sin(bet) * Math.cos(e) + Math.cos(bet) * Math.sin(e) * Math.sin(lam)) * 180 / Math.PI;
            return { ra, dec };
        }

        // Equatorial (hour angle, Dec) -> horizontal (Alt, Az), libnova
        // convention (Az: 0=South, 90=West). Standard formula (Meeus
        // 13.5/13.6).
        function equToHrz(haDeg, decDeg, latDeg) {
            const Hr = haDeg * Math.PI / 180, decr = decDeg * Math.PI / 180, latr = latDeg * Math.PI / 180;
            const sinAlt = Math.sin(latr) * Math.sin(decr) + Math.cos(latr) * Math.cos(decr) * Math.cos(Hr);
            const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) * 180 / Math.PI;
            const az = normDeg(Math.atan2(Math.sin(Hr), Math.cos(Hr) * Math.sin(latr) - Math.tan(decr) * Math.cos(latr)) * 180 / Math.PI);
            return { alt, az };
        }

        // Overridable from the page's own URL (?starsmag=&starssize=&s=) -
        // same convention as bart-monitor.html's chart.
        const skyChartParams = (() => {
            const p = new URLSearchParams(location.search);
            const out = {};
            const mag = parseFloat(p.get('starsmag'));
            const size = parseFloat(p.get('starssize'));
            if (!Number.isNaN(mag)) out.starsMag = mag;
            if (!Number.isNaN(size)) out.starSize = size;
            return out;
        })();

        // Enlarged view's target resolution (?s=) - clamped since this
        // sizes an actual <canvas>, unlike a server-rendered image.
        const bigSkySize = (() => {
            const s = parseInt(new URLSearchParams(location.search).get('s'), 10);
            return Number.isFinite(s) && s > 0 ? Math.min(s, 2000) : 800;
        })();

        function drawSkyChart() {
            // Rendered at the size it is shown at (the panel's width), so
            // it is neither scaled up blurry nor its text scaled down.
            const canvas = document.getElementById('sky-canvas');
            const size = Math.round(canvas.clientWidth);
            if (size > 0 && canvas.width !== size) {
                canvas.width = size;
                canvas.height = size;
            }
            // Fewer and smaller stars than the enlarged view (5.5 mag,
            // 2877 in the catalogue): to 4.0 mag there are 551, which
            // keeps the constellations recognisable at this size.
            // ?starsmag= and ?starssize= still override both.
            renderSkyChart(canvas, { starsMag: 4.0, starSize: 0.7, ...skyChartParams });
        }

        // The horizon as RTS2 enforces it: ObjectCheck::getHorizonHeight
        // (base/kernel/src/objectcheck.cpp) interpolates altitude
        // linearly in azimuth between the nodes, which are sorted by
        // azimuth on load, wrapping from the last node back to the first.
        // In this polar projection such a segment is a curve, not a
        // straight chord between the nodes, so each one is walked in
        // steps of at most 1 deg of azimuth. A vertical step (two nodes
        // at the same azimuth) stays a straight line, as it should.
        function horizonOutline(nodes) {
            const out = [];
            for (let i = 0; i < nodes.length; i++) {
                const [az1, alt1] = nodes[i];
                const [az2, alt2] = nodes[(i + 1) % nodes.length];
                let span = az2 - az1;
                if (i === nodes.length - 1)
                    span += 360;
                out.push([az1, alt1]);
                const steps = Math.ceil(span);
                for (let k = 1; k < steps; k++)
                    out.push([az1 + span * k / steps, alt1 + (alt2 - alt1) * k / steps]);
            }
            return out;
        }

        // canvas: element to draw into - its own width/height attributes
        // set the render resolution (#sky-canvas is resized to its shown width; the
        // enlarged lightbox view sizes itself to the available space).
        // opts.starsMag: limiting magnitude. opts.starSize: dot radius
        // multiplier. opts.enlarged: the lightbox view - label the
        // altitude circles and azimuth lines, and draw N/E/S/W light,
        // since its margin shows the dark lightbox overlay.
        function renderSkyChart(canvas, opts) {
            if (!canvas || !horizonInfo)
                return;
            const { starsMag = 5.5, starSize = 1.0, enlarged = false } = opts || {};
            // Everything but the telescope and target markers is drawn
            // into bg, a copy kept with the canvas: telLoop() redraws
            // only the markers over it, the full chart is redrawn with
            // the 10 s poll.
            const W = canvas.width, Hh = canvas.height;
            const bg = canvas.skyBg || (canvas.skyBg = document.createElement('canvas'));
            bg.width = W;
            bg.height = Hh;
            const ctx = bg.getContext('2d');
            // margin: room outside the rim for the N/E/S/W letters.
            const margin = enlarged ? 14 : 11;
            const cx = W / 2, cy = Hh / 2, R = Math.min(W, Hh) / 2 - margin;

            const dark = document.body.classList.contains('dark');
            const skyBg = dark ? '#05070d' : '#4a7fc9';
            const groundFill = dark ? 'rgba(80,50,20,0.55)' : 'rgba(45,110,55,0.85)';
            const groundStroke = dark ? '#c08030' : '#2d5a26';
            const gridColor = dark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.25)';
            const altLabelColor = dark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.5)';
            const labelColor = dark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.7)';
            const starColor = dark ? '#fff' : '#182449';
            const haloColor = 'rgba(255,255,255,0.9)';

            ctx.clearRect(0, 0, W, Hh);
            ctx.fillStyle = skyBg;
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, 2 * Math.PI);
            ctx.fill();

            // libnova az -> screen. North up, East on the LEFT, West on
            // the RIGHT - a sky chart is a view from inside the celestial
            // sphere looking up, not a ground map.
            function project(altDeg, azLibnovaDeg) {
                const r = Math.min(R, R * (90 - altDeg) / 90);
                const compassAz = normDeg(azLibnovaDeg + 180);
                const a = compassAz * Math.PI / 180;
                return { x: cx - r * Math.sin(a), y: cy - r * Math.cos(a) };
            }

            const now = new Date();
            const jd = julianDate(now);
            const lst = normDeg(gmstDeg(jd) + horizonInfo.lon);
            const lat = horizonInfo.lat;

            if (horizonInfo.horizon && horizonInfo.horizon.length > 2) {
                const outline = horizonOutline(horizonInfo.horizon);
                ctx.beginPath();
                ctx.moveTo(cx + R, cy);
                ctx.arc(cx, cy, R, 0, 2 * Math.PI);
                outline.forEach(([az, alt], i) => {
                    const p = project(alt, az);
                    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
                });
                ctx.closePath();
                ctx.fillStyle = groundFill;
                ctx.fill('evenodd');

                ctx.strokeStyle = groundStroke;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                outline.forEach(([az, alt], i) => {
                    const p = project(alt, az);
                    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
                });
                ctx.closePath();
                ctx.stroke();
            }

            ctx.strokeStyle = gridColor;
            ctx.fillStyle = labelColor;
            ctx.font = '10px sans-serif';
            ctx.lineWidth = 1;
            // Altitude circles every 15 deg; azimuth lines every 30 deg,
            // stopped at the 75 deg circle so they do not crowd together
            // at the zenith, except N-S and E-W, which run through it.
            for (let alt = 0; alt < 90; alt += 15) {
                ctx.beginPath();
                ctx.arc(cx, cy, R * (90 - alt) / 90, 0, 2 * Math.PI);
                ctx.stroke();
            }
            for (let az = 0; az < 360; az += 30) {
                const cardinal = az % 90 === 0;
                const inner = project(cardinal ? 90 : 75, az);
                const edge = project(0, az);
                ctx.beginPath();
                ctx.moveTo(inner.x, inner.y);
                ctx.lineTo(edge.x, edge.y);
                ctx.stroke();
            }
            // Just outside the rim, in the margin R leaves: project()
            // clamps to the rim, so asking it for a negative altitude
            // put the letters on the rim itself, over the grid labels.
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (enlarged)
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
            for (const [label, azLibnova] of [['N', 180], ['E', 270], ['S', 0], ['W', 90]]) {
                const edge = project(0, azLibnova);
                ctx.fillText(label, cx + (edge.x - cx) * (R + margin / 2) / R, cy + (edge.y - cy) * (R + margin / 2) / R);
            }
            ctx.restore();
            // Grid labels, enlarged chart only, small and faint: altitude
            // just right of the north line, azimuth (astronomical, as
            // libnova and RTS2 count it: 0 at south, 90 at west) just
            // inside the horizon circle on each azimuth line.
            if (enlarged) {
                ctx.save();
                ctx.font = `${Math.max(9, Math.round(R / 30))}px sans-serif`;
                ctx.textBaseline = 'middle';
                ctx.fillStyle = altLabelColor;
                for (let alt = 15; alt < 90; alt += 15) {
                    const p = project(alt, 180);
                    ctx.fillText(`${alt}°`, p.x + 2, p.y);
                }
                // Each label is pulled in from the rim just far enough for
                // its box to clear it: by half its width at E/W, half its
                // height at N/S.
                ctx.textAlign = 'center';
                const fontPx = Math.max(9, Math.round(R / 30));
                for (let az = 0; az < 360; az += 30) {
                    const text = `${az}°`;
                    const edge = project(0, az);
                    const ux = (edge.x - cx) / R, uy = (edge.y - cy) / R;
                    const inset = 4 + Math.abs(ux) * ctx.measureText(text).width / 2 + Math.abs(uy) * fontPx / 2;
                    ctx.fillText(text, edge.x - ux * inset, edge.y - uy * inset);
                }
                ctx.restore();
            }

            if (starCatalog) {
                ctx.fillStyle = starColor;
                for (const [ra, dec, mag] of starCatalog) {
                    if (mag > starsMag)
                        continue;
                    const hz = equToHrz(lst - ra, dec, lat);
                    if (hz.alt <= 0)
                        continue;
                    const p = project(hz.alt, hz.az);
                    // Sized from 5.5 mag (or a fainter limit), not from
                    // starsMag itself, so a star is the same size whatever
                    // the limit and a lower one only drops the faint ones.
                    const size = Math.max(0.4, (Math.max(starsMag, 5.5) - mag) * 0.5) * starSize;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, 2 * Math.PI);
                    ctx.fill();
                }
            } else {
                ctx.fillStyle = labelColor;
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('stars unavailable', cx, cy + R - 10);
                ctx.textAlign = 'left';
            }

            // (on the shown canvas, from skyMarkers below)
            function strokeWithHalo(color, width, pathFn) {
                view.lineWidth = width + 2.5;
                view.strokeStyle = haloColor;
                view.beginPath();
                pathFn();
                view.stroke();
                view.lineWidth = width;
                view.strokeStyle = color;
                view.beginPath();
                pathFn();
                view.stroke();
            }

            const sun = sunEquatorial(jd);
            const sunHz = equToHrz(lst - sun.ra, sun.dec, lat);
            if (sunHz.alt > -6) {
                const p = project(Math.max(sunHz.alt, 0), sunHz.az);
                ctx.fillStyle = '#ffb020';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
                ctx.fill();
            }

            const moon = moonEquatorial(jd);
            const moonHz = equToHrz(lst - moon.ra, moon.dec, lat);
            if (moonHz.alt > 0) {
                const p = project(moonHz.alt, moonHz.az);
                ctx.fillStyle = '#c8c8d0';
                ctx.strokeStyle = haloColor;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();
            }

            const view = canvas.getContext('2d');
            canvas.skyMarkers = () => {
                view.clearRect(0, 0, W, Hh);
                view.drawImage(bg, 0, 0);
                const lstNow = normDeg(gmstDeg(julianDate(new Date())) + horizonInfo.lon);

                // Telescope position - T0's TEL_ is already Alt/Az (libnova
                // convention). Reuses parseRaDec() purely because it's the
                // same "two space-separated floats" wire format, not because
                // this is actually RA/Dec.
                const [telAlt, telAz] = parseRaDec(safeValue(systemData.T0, 'TEL_', ''));
                if (!Number.isNaN(telAlt) && !Number.isNaN(telAz)) {
                    const p = project(telAlt, telAz);
                    strokeWithHalo('#ff4040', 2, () => {
                        view.moveTo(p.x - 6, p.y); view.lineTo(p.x + 6, p.y);
                        view.moveTo(p.x, p.y - 6); view.lineTo(p.x, p.y + 6);
                    });
                }

                // Target position - T0's TAR (RA/Dec with corrections applied).
                const [tarRa, tarDec] = parseRaDec(safeValue(systemData.T0, 'TAR', ''));
                if (!Number.isNaN(tarRa) && !Number.isNaN(tarDec)) {
                    const tarHz = equToHrz(lstNow - tarRa, tarDec, lat);
                    const p = project(tarHz.alt, tarHz.az);
                    strokeWithHalo('#4090ff', 2, () => {
                        view.arc(p.x, p.y, 6, 0, 2 * Math.PI);
                    });
                }
            };
            canvas.skyMarkers();
        }

        // Lightbox
        let lightboxInterval = null;

        // Sizes the image to its actual fitted (scaled up or down) pixel
        // size within .lightbox-img-wrap, rather than leaving it at
        // width:100%/height:100%.
        function fitLightboxImage() {
            const wrap = document.querySelector('.lightbox-img-wrap');
            const img = document.getElementById('lightbox-img');
            if (!wrap || !img.naturalWidth || !img.naturalHeight)
                return;
            const rect = wrap.getBoundingClientRect();
            const scale = Math.min(rect.width / img.naturalWidth, rect.height / img.naturalHeight);
            img.style.width = Math.round(img.naturalWidth * scale) + 'px';
            img.style.height = Math.round(img.naturalHeight * scale) + 'px';
        }
        document.getElementById('lightbox-img').addEventListener('load', () => {
            fitLightboxImage();
            applyLightboxZoom();
        });

        // Zoom and pan in the enlarged image. The wheel (two fingers or a
        // pinch on a touchpad) zooms; the image follows the mouse, with
        // no button held, so that a click still closes it: the mouse at
        // the wrap's left edge shows the image's left edge, at its right
        // edge the right edge (with a margin, LIGHTBOX_PAN_EDGE, which
        // already counts as the edge). That also keeps the point under
        // the mouse where it is while zooming. lightboxZoom is relative
        // to the fitted size; the info line gives it in the camera's own
        // pixels (100 % = one image pixel per screen pixel), and from
        // 200 % up the pixels are drawn sharp, not smoothed. A small
        // image, which fitting enlarges, zooms out down to 100 %.
        const LIGHTBOX_MAX_PIXEL = 8;    // screen pixels per image pixel, at most
        const LIGHTBOX_PAN_EDGE = 0.1;
        let lightboxZoom = 1;
        let lightboxMouse = { x: 0.5, y: 0.5 };   // in the wrap, 0-1
        let lightboxInfoText = '';

        function applyLightboxZoom() {
            const wrap = document.querySelector('.lightbox-img-wrap');
            const img = document.getElementById('lightbox-img');
            const w0 = img.offsetWidth, h0 = img.offsetHeight;
            const info = document.getElementById('lightbox-info');
            if (!img.naturalWidth || !w0) {
                info.textContent = lightboxInfoText;
                return;
            }
            const maxZoom = Math.max(1, LIGHTBOX_MAX_PIXEL * img.naturalWidth / w0);
            const minZoom = Math.min(1, img.naturalWidth / w0);
            lightboxZoom = Math.min(maxZoom, Math.max(minZoom, lightboxZoom));
            const W = wrap.clientWidth, H = wrap.clientHeight;
            // the image's shift from the centre, per axis
            const shift = (size, view, mouse) => {
                if (size <= view)
                    return 0;
                const u = Math.min(1, Math.max(0, (mouse - LIGHTBOX_PAN_EDGE) / (1 - 2 * LIGHTBOX_PAN_EDGE)));
                return (view - size) * u + (size - view) / 2;
            };
            const dx = shift(w0 * lightboxZoom, W, lightboxMouse.x);
            const dy = shift(h0 * lightboxZoom, H, lightboxMouse.y);
            img.style.transform = lightboxZoom !== 1 ? `translate(${dx}px, ${dy}px) scale(${lightboxZoom})` : '';
            img.classList.toggle('zoomed', lightboxZoom > 1);
            const pixel = w0 * lightboxZoom / img.naturalWidth;
            img.classList.toggle('pixels', pixel >= 2);
            info.textContent = `${lightboxInfoText} - ${Math.round(100 * pixel)} %`;
        }

        function lightboxShowsImage() {
            return document.getElementById('lightbox').style.display === 'block'
                && document.getElementById('lightbox-img').style.display !== 'none';
        }

        function noteLightboxMouse(e) {
            const rect = document.querySelector('.lightbox-img-wrap').getBoundingClientRect();
            lightboxMouse = {
                x: rect.width ? (e.clientX - rect.left) / rect.width : 0.5,
                y: rect.height ? (e.clientY - rect.top) / rect.height : 0.5,
            };
        }

        document.getElementById('lightbox').addEventListener('wheel', e => {
            // never scroll the page under it, nor zoom the browser (a
            // touchpad pinch comes as a wheel event with ctrlKey)
            e.preventDefault();
            if (!lightboxShowsImage())
                return;
            noteLightboxMouse(e);
            const dy = e.deltaY * (e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 800 : 1);
            lightboxZoom *= Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.002));
            applyLightboxZoom();
        }, { passive: false });

        document.getElementById('lightbox').addEventListener('mousemove', e => {
            if (!lightboxShowsImage() || lightboxZoom <= 1)
                return;
            noteLightboxMouse(e);
            applyLightboxZoom();
        });

        window.addEventListener('resize', () => {
            if (!lightboxShowsImage())
                return;
            fitLightboxImage();
            applyLightboxZoom();
        });

        // noRefresh: for a live MJPEG stream URL, the periodic cache-
        // busting below would force it to drop and reconnect every 15s -
        // skip it for those, the stream already updates itself.
        function openLightbox(imageSrc, title, noRefresh) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            document.getElementById('lightbox-sky-canvas').style.display = 'none';
            img.style.display = '';
            lightboxZoom = 1;
            img.style.transform = '';
            img.classList.remove('zoomed', 'pixels');
            img.src = noRefresh ? imageSrc : `${imageSrc}${imageSrc.includes('?') ? '&' : '?'}t=${new Date().getTime()}`;
            document.getElementById('lightbox-title').textContent = title;
            lightboxInfoText = 'Scroll to zoom, move the mouse to look around, click or Esc to close'
                + (noRefresh ? '' : ' - auto-refreshing every 15s');
            document.getElementById('lightbox-info').textContent = lightboxInfoText;
            lightbox.style.display = 'block';

            if (!noRefresh) {
                lightboxInterval = setInterval(() => {
                    const nt = new Date().getTime();
                    const base = img.src.split(/[?&]t=/)[0];
                    img.src = `${base}${base.includes('?') ? '&' : '?'}t=${nt}`;
                }, 15000);
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            lightboxLive = false;
            if (lightboxInterval) {
                clearInterval(lightboxInterval);
                lightboxInterval = null;
            }
        }

        // Enlarged sky chart - reuses the same lightbox, but shows
        // #lightbox-sky-canvas instead of #lightbox-img. Re-rendered
        // every 10s so the telescope/target markers keep moving.
        function openSkyLightbox() {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            const canvas = document.getElementById('lightbox-sky-canvas');
            img.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('lightbox-title').textContent = 'Sky chart';
            document.getElementById('lightbox-info').textContent =
                'Click anywhere to close - tweak with ?starsmag=&starssize=&s= in the page URL';
            // Must be shown before measuring the wrap below - it's
            // display:none up to this point.
            lightbox.style.display = 'block';

            const wrap = document.querySelector('.lightbox-img-wrap');
            const rect = wrap.getBoundingClientRect();
            const size = Math.round(Math.min(bigSkySize, rect.width, rect.height));
            canvas.width = size;
            canvas.height = size;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';

            const params = { ...skyChartParams, enlarged: true };
            renderSkyChart(canvas, params);
            lightboxInterval = setInterval(() => renderSkyChart(canvas, params), 10000);
        }

        // a click anywhere closes it, on the image too
        document.getElementById('lightbox').addEventListener('click', closeLightbox);
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape')
                closeLightbox();
        });

        // The cameras are polled every 2 s on their own, so an exposure
        // shows within 2 s of its start rather than at the next 10 s
        // poll (a short exposure could start and end between two). Each
        // round waits for the last, so a slow link does not pile up
        // requests; a hidden tab polls only at the 10 s rate.
        const CAMERAS = ['C0'];
        const CAMERA_POLL_MS = 2000;

        async function cameraLoop() {
            if (!document.hidden) {
                await Promise.all(CAMERAS.map(async cam => {
                    const data = await fetchDeviceData(cam);
                    if (data)
                        systemData[cam] = data;
                }));
                updateCameraStatus();
            }
            // traffic modes (see netMode): with the WebSocket the cameras' changes
            // arrive by themselves, and a state change fetches the camera
            setTimeout(cameraLoop, netMode !== 'live' ? 60000
                : liveSocket && liveSocket.readyState === 1 ? 10000 : CAMERA_POLL_MS);
        }

        // The telescope's position is polled on its own, only TEL_ (about
        // 60 B, the whole T0 is 6 KB): every 2 s, and every 0.5 s while it
        // moves and for 5 s after. A move redraws the sky chart's markers
        // (over the copy renderSkyChart keeps) and the telescope panel,
        // not the stars. TAR comes along in the fast rounds, so a new
        // target's circle shows with the slew, not at the next 10 s poll.
        const TEL_POLL_MS = 2000, TEL_FAST_MS = 500, TEL_FAST_AFTER_MS = 5000;
        // deg; tracking moves the mount far less in 2 s
        const TEL_MOVED_DEG = 0.02;
        let telFastUntil = 0;

        // One value of a device, undefined when it did not answer.
        async function fetchValue(device, name) {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), FETCH_TIMEOUT_MS);
            try {
                const sent = Date.now();
                const res = await fetch(`${API_BASE}/get?d=${device}&n=${name}`, { signal: ctl.signal, cache: 'no-store' });
                noteServerDate(res, sent, Date.now());
                if (!res.ok)
                    return undefined;
                return (await res.json())[name];
            } catch (e) {
                return undefined;
            } finally {
                clearTimeout(timer);
            }
        }

        function redrawSkyMarkers() {
            for (const id of ['sky-canvas', 'lightbox-sky-canvas']) {
                const canvas = document.getElementById(id);
                if (canvas && canvas.skyMarkers)
                    canvas.skyMarkers();
            }
        }

        async function telLoop() {
            if (!document.hidden) {
                const fast = Date.now() < telFastUntil;
                const [tel, tar] = await Promise.all([fetchValue('T0', 'TEL_'),
                    fast ? fetchValue('T0', 'TAR') : undefined]);
                const t0 = systemData.T0;
                if (tel !== undefined && t0) {
                    const [alt0, az0] = parseRaDec(safeValue(t0, 'TEL_', ''));
                    const [alt1, az1] = parseRaDec(tel);
                    const dAz = ((az1 - az0 + 540) % 360) - 180;
                    // on the sky, so that azimuth near the zenith counts less
                    const moved = !(Math.hypot(alt1 - alt0, dAz * Math.cos(alt1 * Math.PI / 180)) < TEL_MOVED_DEG);
                    const newTar = tar !== undefined && tar !== safeValue(t0, 'TAR', undefined);
                    t0.TEL_ = tel;
                    if (tar !== undefined)
                        t0.TAR = tar;
                    if (moved)
                        telFastUntil = Date.now() + TEL_FAST_AFTER_MS;
                    if (moved || newTar) {
                        redrawSkyMarkers();
                        updateTelescopeStatus();
                    }
                }
            }
            setTimeout(telLoop, netMode === 'low' ? 60000 : netMode === 'idle' ? 30000
                : Date.now() < telFastUntil ? TEL_FAST_MS : TEL_POLL_MS);
        }

        // The bars move every frame from their start and end, not in the
        // 1 s steps of the state lines' redraw.
        function animateBars() {
            const now = serverNow();
            for (const bar of document.querySelectorAll('.cam-bar[data-to]')) {
                const from = Number(bar.dataset.from), to = Number(bar.dataset.to);
                if (to > from)
                    bar.firstElementChild.style.width = `${Math.min(100, Math.max(0, 100 * (now - from) / (to - from)))}%`;
            }
            requestAnimationFrame(animateBars);
        }

        async function init() {
            document.getElementById('equalize-btn').classList.toggle('active', equalizeWebcams);
            setLive(liveWebcams);
            for (const cam of WEBCAMS) {
                document.getElementById(`webcam-${cam.id}`).addEventListener('click', () => {
                    openLightbox(webcamFullSrc(cam), `${cam.label} - Full View`, liveWebcams && !!cam.live);
                    lightboxLive = liveWebcams && !!cam.live;
                });
            }
            document.getElementById('sky-canvas').addEventListener('click', openSkyLightbox);
            window.addEventListener('resize', drawSkyChart);

            await Promise.all([loadHorizonInfo(), loadStarCatalog()]);
            await updateStatus();
            cameraLoop();
            telLoop();
            requestAnimationFrame(animateBars);
            reloadWebcams();
            updateSentinelLed();
            reloadCameraImages();
            updateImageInfo();
            reloadCloudGraph();
            reloadGuideHistory();
            guideLoop();
        }

        // Live camera updates over rts2-httpd's WebSocket (/ws, behind the
        // same Apache ProxyPass as the API; needs "upgrade=websocket" on that
        // line). httpd pushes every value change of every device; the
        // cameras' are merged into systemData and the camera lines redrawn at
        // once, so a short script loop shows. A camera state change (an
        // exposure or readout starting) fetches that camera, for the progress
        // times the state event does not carry. The 10 s polling stays, so
        // the page works as before without the WebSocket. [JS 2026-10-29]
        const LIVE_CAMS = ['C0', 'C1'];
        let liveSocketDelay = 5000;
        let liveSocket = null;
        function startLiveUpdates() {
            if (netMode !== 'live' || liveSocket)
                return;
            let ws;
            try {
                const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host
                    + API_BASE.replace(/\/api$/, '') + '/ws';
                ws = new WebSocket(url);
                liveSocket = ws;
            } catch (e) {
                setTimeout(startLiveUpdates, liveSocketDelay);
                return;
            }
            ws.onopen = () => { liveSocketDelay = 5000; };
            ws.onmessage = ev => {
                let m;
                try { m = JSON.parse(ev.data); } catch (e) { return; }
                if (!LIVE_CAMS.includes(m.device))
                    return;
                if (m.event === 'value' && m.v) {
                    systemData[m.device] = Object.assign(systemData[m.device] || {}, m.v);
                    updateCameraStatus();
                } else if (m.event === 'state') {
                    if (systemData[m.device])
                        systemData[m.device].state = m.value;
                    updateCameraStatus();
                    fetchDeviceData(m.device).then(d => {
                        if (d) {
                            systemData[m.device] = d;
                            updateCameraStatus();
                        }
                    }).catch(() => {});
                }
            };
            ws.onclose = () => {
                liveSocket = null;
                if (netMode !== 'live')
                    return;
                setTimeout(startLiveUpdates, liveSocketDelay);
                liveSocketDelay = Math.min(liveSocketDelay * 2, 60000);
            };
        }
        // Traffic modes [JS 2026-10-29]. An open page loaded ~25 KB/s all the
        // time (~90 MB an hour): camera images re-downloaded every 15 s whether
        // or not they changed, webcams, polling, the guide camera at 1 s, the
        // WebSocket. Now:
        //  - an image is re-downloaded only when its Last-Modified (or ETag,
        //    or length) changed - a HEAD request, a few hundred bytes. Images
        //    from another site (headers not readable) reload as before.
        //  - 'live': something is observed (an executor target, or a camera
        //    exposing or reading out): WebSocket on, status 10 s, images 15 s,
        //    guiding at its own rate
        //  - 'idle': nothing observed: no WebSocket, status 60 s, images 60 s
        //  - 'low': a slow link - small API answers over 2 s, or big downloads
        //    under 30 KB/s (resource timing), or the browser's Save-Data or a
        //    2G/3G connection: no WebSocket, status 60 s, webcams paused,
        //    camera images 300 s; left after 60 s without slow signs
        // The mode follows the data and the link by itself; a corner note
        // shows it when it is not live.
        let netMode = 'live';
        const NET_DELAYS = {
            status:  { live: 10000, idle: 60000, low: 60000 },
            images:  { live: 15000, idle: 60000, low: 300000 },
            webcams: { live: 15000, idle: 60000, low: null },
            slow:    { live: 60000, idle: 300000, low: 900000 },
        };
        const imageKeys = {};
        async function refreshImage(el, url) {
            if (!el)
                return;
            let key = null;
            // another site's headers are not readable here (CORS)
            if (!/^https?:\/\//.test(url) || url.startsWith(location.origin)) {
                try {
                    const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
                    if (res.ok)
                        key = res.headers.get('Last-Modified') || res.headers.get('ETag') || res.headers.get('Content-Length');
                } catch (e) {}
            }
            if (key === null)
                key = String(Date.now());
            if (imageKeys[url] === key && el.getAttribute('src'))
                return;
            imageKeys[url] = key;
            el.src = url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(key);
        }

        function observingNow() {
            const exec = safeValue(systemData.EXEC, 'current', -1);
            if (typeof exec === 'number' && exec >= 0)
                return true;
            return LIVE_CAMS.some(cam => {
                const st = safeValue(systemData[cam], 'state', 0);
                return typeof st === 'number' && (st & 0x017) !== 0;
            });
        }

        // the link, from the page's own requests
        const linkSamples = { latency: [], rate: [] };
        let lastSlowSign = 0;
        function noteSample(list, value) {
            list.push({ t: Date.now(), v: value });
            while (list.length > 8 || (list.length && Date.now() - list[0].t > 300000))
                list.shift();
        }
        function median(list) {
            const v = list.map(s => s.v).sort((a, b) => a - b);
            return v.length ? v[Math.floor(v.length / 2)] : null;
        }
        try {
            new PerformanceObserver(list => {
                for (const e of list.getEntries()) {
                    if (!e.transferSize || e.name.includes('/ws'))
                        continue;
                    if (e.transferSize < 8000 && e.responseStart > e.requestStart)
                        noteSample(linkSamples.latency, e.responseStart - e.requestStart);
                    else if (e.transferSize >= 20000 && e.responseEnd > e.responseStart)
                        noteSample(linkSamples.rate, e.transferSize / (e.responseEnd - e.responseStart));
                }
            }).observe({ type: 'resource', buffered: true });
        } catch (e) {}
        function linkIsSlow() {
            const c = navigator.connection;
            if (c && (c.saveData || ['slow-2g', '2g', '3g'].includes(c.effectiveType)))
                return true;
            const lat = linkSamples.latency.length >= 3 ? median(linkSamples.latency) : null;
            const rate = linkSamples.rate.length >= 2 ? median(linkSamples.rate) : null;
            return (lat !== null && lat > 2000) || (rate !== null && rate < 30);
        }

        const netTasks = [];
        function netTask(fn, delays) {
            const task = { fn, delays, timer: null };
            task.run = () => {
                task.timer = null;
                const d = task.delays[netMode];
                if (d === null)
                    return;
                Promise.resolve().then(task.fn).catch(e => console.error(e));
                task.timer = setTimeout(task.run, d);
            };
            task.start = first => {
                if (task.timer)
                    clearTimeout(task.timer);
                const d = task.delays[netMode];
                task.timer = d === null ? null : setTimeout(task.run, first !== undefined ? first : d);
            };
            netTasks.push(task);
            task.start();
        }

        function setNetMode(mode) {
            if (mode === netMode)
                return;
            netMode = mode;
            let note = document.getElementById('net-mode');
            if (!note) {
                note = document.createElement('div');
                note.id = 'net-mode';
                note.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:50;padding:3px 8px;'
                    + 'font-size:11px;border-radius:3px;background:var(--panel-bg);color:var(--text-muted);'
                    + 'border:1px solid var(--border)';
                document.body.appendChild(note);
            }
            note.textContent = mode === 'low' ? 'slow connection: webcams paused, slower refresh'
                : mode === 'idle' ? 'nothing observed: slower refresh' : '';
            note.style.display = mode === 'live' ? 'none' : '';
            if (mode === 'live')
                startLiveUpdates();
            else if (liveSocket)
                liveSocket.close();
            // a mode that refreshes faster starts at once
            for (const t of netTasks)
                t.start(mode === 'live' ? 0 : undefined);
        }

        function evaluateNetMode() {
            const now = Date.now();
            if (linkIsSlow())
                lastSlowSign = now;
            if (netMode === 'low' && now - lastSlowSign < 60000)
                return;
            if (linkIsSlow()) {
                setNetMode('low');
                return;
            }
            setNetMode(observingNow() ? 'live' : 'idle');
        }

        startLiveUpdates();
        netTask(() => updateStatus().then(evaluateNetMode), NET_DELAYS.status);
        // the state lines' seconds count between polls
        setInterval(updateCameraStatus, 1000);
        setInterval(evaluateNetMode, 5000);
        netTask(reloadWebcams, NET_DELAYS.webcams);
        netTask(updateSentinelLed, { live: 60000, idle: 300000, low: 900000 });
        netTask(reloadCameraImages, NET_DELAYS.images);
        netTask(updateImageInfo, NET_DELAYS.images);
        netTask(reloadCloudGraph, NET_DELAYS.slow);
        netTask(reloadGuideHistory, NET_DELAYS.slow);
        window.addEventListener('load', init);
    </script>
</body>
</html>
