<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D50 Telescope - Ondřejov Observatory</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --panel-bg: #ffffff;
            --border: #ccc;
            --text: #000000;
            --text-muted: #555;
            --th-bg: #ddd;
            --logo-bg: #e8e8e8;
            --good: #008b00;
            --warn: #8B0000;
            --error: #ff0000;
            --graph-line: #2563eb;
            --graph-band: rgba(37, 99, 235, 0.18);
            --graph-day-bg: rgba(255, 190, 40, 0.12);
            --graph-twilight-bg: rgba(37, 99, 235, 0.08);
            --graph-line2: #d97706;
        }

        body.dark {
            --bg: #1a1a1a;
            --panel-bg: #262626;
            --border: #444;
            --text: #ddd;
            --text-muted: #aaa;
            --th-bg: #333;
            --logo-bg: #2f2f2f;
            --good: #4fd14f;
            --warn: #ff8a8a;
            --error: #ff5c5c;
            --graph-line: #6fb3ff;
            --graph-band: rgba(111, 179, 255, 0.22);
            --graph-day-bg: rgba(255, 190, 40, 0.10);
            --graph-twilight-bg: rgba(111, 179, 255, 0.10);
            --graph-line2: #ffb45c;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg);
            color: var(--text);
            font-size: 12px;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 10px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            /* Otherwise a grid item stretches to match the row height -
               cam-panel is taller now (two stacked camera rows), and the
               title/status column should stay its own natural height
               rather than growing to fill that. Same reasoning as
               bart-monitor.html's identical rule. */
            align-self: start;
        }

        .status-panel, .image-panel, .webcam-panel, .cam-panel, .cloud-panel, .guide-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 5px;
        }

        .logo {
            text-align: center;
            border: 2px solid var(--text);
            padding: 10px;
            background-color: var(--logo-bg);
        }

        .logo h1 { margin: 5px 0; font-size: 24px; }
        .logo h2 { margin: 5px 0; font-size: 14px; font-weight: normal; }

        .temp-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 11px;
        }

        .temp-table th, .temp-table td {
            border: 1px solid var(--border);
            padding: 3px;
            text-align: center;
        }

        .temp-table th { background-color: var(--th-bg); font-weight: bold; }

        .webcam-panel, .cloud-panel {
            /* Placed as a direct grid child of .container (not nested
               inside .left-panel, which is fixed at 320px) so it can
               span the full page width, below the title/status +
               cameras row. */
            grid-column: 1 / -1;
        }

        .right-panel {
            /* Cameras and guiding share .container's second (flexible)
               column, stacked - so the guiding panel is exactly as wide
               as the C0 box above it and sits beside the title/status
               column rather than under it. The left column is going to
               grow; a full-width panel under a short left column would
               leave the page lopsided. Same align-self reasoning as
               .left-panel's, and min-width:0 so the plots inside can be
               narrower than their content wants to be. */
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-self: start;
            min-width: 0;
        }

        /* Guiding: the guide star as it looks right now, the last few
           minutes of error next to it, and where those errors sit
           against each other. The frame is a 48x48 cutout - blown up to
           this size it is meant to look like pixels, not like a blurred
           photograph, hence image-rendering. */
        .guide-grid {
            display: grid;
            grid-template-columns: 200px minmax(0, 1fr) 200px;
            gap: 12px;
            align-items: start;
        }

        #guide-frame-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: contain;
            background: #111;
            border: 1px solid var(--border);
            cursor: pointer;
            image-rendering: pixelated;
        }

        #guide-live, #guide-scatter, #guide-history { display: block; width: 100%; }
        #guide-live { height: 210px; }
        #guide-scatter { aspect-ratio: 1; height: auto; }
        #guide-history { height: 170px; margin-top: 10px; }

        .guide-readout { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
        .guide-readout .big { font-size: 15px; color: var(--text); }
        .guide-readout .big.warn { color: var(--warn); }
        #c1-status .status-value { display: inline; margin-right: 14px; }

        @media (max-width: 900px) {
            .guide-grid { grid-template-columns: 1fr; }
        }

        body.compact .guide-grid { grid-template-columns: 150px minmax(0, 1fr) 150px; gap: 6px; }
        body.compact #guide-live { height: 130px; }
        body.compact #guide-history { height: 110px; }

        #cloud-canvas {
            display: block;
            width: 100%;
            /* the canvas has no intrinsic size to lay itself out from,
               and drawCloudGraph() takes its backing store from this box */
            height: 220px;
        }

        .cloud-ranges { float: right; }
        .cloud-ranges button {
            font-size: 11px;
            padding: 2px 7px;
            margin-left: 4px;
            cursor: pointer;
            background: var(--panel-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        .cloud-ranges button.active { background: var(--good); color: white; border-color: var(--good); }

        .cloud-status { margin-top: 4px; font-size: 11px; color: var(--text-muted); }
        .cloud-status.warn { color: var(--warn); }

        /* cam-panel stays beside .left-panel (title/status), occupying
           .container's second (flexible) column - not full width. One
           row per camera within it, stacked vertically, each row
           showing its two images large. Only two rows here (C0/C1) vs
           bart-monitor.html's three (C1/C2/C3) - same .cam-grid/.cam-box
           rules handle either count without change. */
        .cam-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cam-box {
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cam-box h4 {
            margin: 0;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            flex-shrink: 0;
        }

        .cam-box-body { flex: 1; min-width: 0; }

        .latest-image {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 6px;
        }

        .latest-image img {
            width: 100%;
            height: 480px;
            object-fit: contain;
            background: #111;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .latest-image-info {
            font-size: 10px;
            color: var(--text-muted);
            white-space: pre-line;
            text-align: left;
            margin: 0 0 6px 0;
        }

        .webcam-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .webcam-column {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        .webcam-column img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            background: #000;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        /* Space is dark regardless of page theme, so this doesn't
           follow --panel-bg/--text like everything else. */
        #sky-canvas { width: 100%; height: auto; aspect-ratio: 1; border-radius: 50%; cursor: pointer; }

        .control-buttons { display: flex; gap: 5px; flex-wrap: wrap; }

        .control-buttons button {
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            background: var(--panel-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
        }

        .state-buttons button { font-weight: bold; padding: 8px 10px; font-size: 12px; flex: 1; }
        .state-buttons .state-on { border-color: var(--good); color: var(--good); }
        .state-buttons .state-standby { border-color: #b8860b; color: #b8860b; }
        .state-buttons .state-off { border-color: var(--warn); color: var(--warn); }

        #equalize-btn, #live-btn {
            cursor: pointer;
            background: var(--panel-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        #equalize-btn.active, #live-btn.active { background: var(--good); color: white; border-color: var(--good); }

        .status-value { margin: 3px 0; }

        .error { color: var(--error); font-weight: bold; }
        .good { color: var(--good); }
        .warn { color: var(--warn); }
        .standby { color: #b8860b; font-weight: bold; }

        hr { margin: 10px 0; border: 1px solid var(--border); }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }

        .lightbox-content {
            position: relative;
            margin: auto;
            padding: 20px;
            width: 90%;
            height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* title/info take their natural height; the wrap flexes to
           fill whatever's left of the 90vh box, and centers the image
           inside it. The image's own box is sized in JS to its actual
           fitted (scaled up or down) pixel size - not just left at
           100%/100% of the wrap - so the border/shadow hug the visible
           picture instead of an invisible, letterboxed square around
           it. */
        .lightbox-title, .lightbox-info { flex: 0 0 auto; }
        .lightbox-img-wrap {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .lightbox img, .lightbox-img-wrap canvas {
            display: block;
            object-fit: contain;
            border: 2px solid white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Enlarged sky chart shown in the lightbox - round, like the
           sidebar one, and hidden by default since the lightbox is
           normally showing #lightbox-img instead. */
        #lightbox-sky-canvas { display: none; border-radius: 50%; }

        .lightbox-title { color: white; font-size: 18px; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .lightbox-close { position: absolute; top: 10px; right: 25px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; user-select: none; }
        .lightbox-close:hover { color: #ccc; }
        .lightbox-info { color: white; font-size: 14px; margin-top: 10px; text-align: center; }

        /* Compact mode (toggled via JS, persisted in a cookie, not tied
           to viewport width like the media queries below) - squeezes
           the page enough to fit on one screen for a quick glance. */
        body.compact .container { max-width: none; gap: 6px; }
        body.compact .status-panel, body.compact .image-panel,
        body.compact .webcam-panel, body.compact .cam-panel, body.compact .cloud-panel,
        body.compact .guide-panel { padding: 5px; }
        body.compact .right-panel { gap: 6px; }
        body.compact .logo { padding: 4px; }
        body.compact .logo h1 { font-size: 16px; margin: 2px 0; }
        body.compact .logo h2 { font-size: 11px; margin: 2px 0; }
        /* Two cameras side by side as columns instead of stacked rows -
           same reasoning as bart-monitor.html's three-column version,
           just one column narrower. */
        body.compact .cam-grid { flex-direction: row; gap: 4px; }
        body.compact .cam-box { flex: 1; flex-direction: column; align-items: stretch; padding: 4px; gap: 4px; }
        body.compact .cam-box h4 { writing-mode: horizontal-tb; transform: none; text-align: center; }
        body.compact .latest-image { grid-template-columns: 1fr; gap: 4px; margin-bottom: 2px; }
        body.compact .latest-image img { height: auto; object-fit: initial; background: none; }
        body.compact .latest-image-info { font-size: 9px; }
        body.compact .webcam-grid { gap: 4px; }
        body.compact .webcam-column img { aspect-ratio: 16 / 9; }
        body.compact .temp-table { margin: 4px 0; }
        body.compact .control-buttons { gap: 3px; }
        body.compact .control-buttons button { padding: 3px 6px; }
        body.compact hr { margin: 4px 0; }

        /* Non-compact mode reflows at these breakpoints; compact mode
           gets its own, narrower ones below - same split as
           bart-monitor.html, same reasoning (a half-width window on a
           wide screen shouldn't drop into the phone layout just because
           compact mode is also on). */
        @media (max-width: 1200px) {
            body:not(.compact) .container { grid-template-columns: 1fr; }
            body:not(.compact) .webcam-grid { grid-template-columns: repeat(2, 1fr); }
            body:not(.compact) .latest-image img { height: 320px; }
        }

        @media (max-width: 700px) {
            body:not(.compact) .webcam-grid { grid-template-columns: 1fr; }
            body:not(.compact) .cam-box { flex-direction: column; align-items: stretch; }
            body:not(.compact) .cam-box h4 { writing-mode: horizontal-tb; transform: none; text-align: center; }
            body:not(.compact) .latest-image { grid-template-columns: 1fr; }
            body:not(.compact) .latest-image img { height: 220px; }

            body.compact .webcam-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            body.compact .container { grid-template-columns: 1fr; }
            body.compact .webcam-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <script>
        // Applied inline, before the rest of the page renders, so
        // dark/compact mode doesn't flash the default theme first.
        (function () {
            const m = document.cookie.match(/(?:^|; )darkMode=1(?:;|$)/);
            if (m) document.body.classList.add('dark');
            const c = document.cookie.match(/(?:^|; )compactMode=1(?:;|$)/);
            if (c) document.body.classList.add('compact');
        })();
    </script>
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close">&times;</span>
            <div class="lightbox-title" id="lightbox-title"></div>
            <div class="lightbox-img-wrap">
                <img id="lightbox-img" src="" alt="Lightbox Image">
                <canvas id="lightbox-sky-canvas"></canvas>
            </div>
            <div class="lightbox-info" id="lightbox-info">Click anywhere to close</div>
        </div>
    </div>

    <div class="container">
        <div class="left-panel">
            <div class="status-panel">
                <div class="logo">
                    <h1>D50 Telescope</h1>
                    <h2>Ondřejov Observatory</h2>
                </div>
                <div id="status-info">
                    <div class="status-value"><strong>Status:</strong> <span id="serverd-status">...</span></div>
                    <div id="telescope-status"></div>
                    <div id="dome-status"></div>
                    <hr>
                    <div id="weather-status"></div>
                </div>
            </div>

            <div class="status-panel" style="text-align: center;">
                <h3 style="margin: 0 0 6px 0;">Sky</h3>
                <canvas id="sky-canvas" width="300" height="300" title="Click to enlarge"></canvas>
            </div>

            <div class="control-buttons state-buttons">
                <button class="state-on" onclick="switchState('on')">ON</button>
                <button class="state-standby" onclick="switchState('standby')">STANDBY</button>
                <button class="state-off" onclick="switchState('off')">OFF</button>
            </div>
            <div id="state-msg" class="status-value"></div>

            <div class="control-buttons">
                <button onclick="reloadWebcams()">reload webcams</button>
                <button onclick="openArchive()">image archive</button>
                <button onclick="toggleDarkMode()">dark mode</button>
                <button onclick="toggleCompactMode()">compact mode</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="cam-panel">
                <h3 style="margin-top: 0;">Cameras</h3>
                <div class="cam-grid">
                    <div class="cam-box">
                        <h4>C0</h4>
                        <div class="cam-box-body">
                            <div class="latest-image">
                                <img id="c0-image" src="C0_small.jpg" alt="C0" onclick="openLightbox('C0_full.jpg', 'C0 - Full Image')">
                                <img id="c0-center" src="C0_center.jpg" alt="C0 center" onclick="openLightbox('C0_full.jpg', 'C0 - Full Image')">
                            </div>
                            <div id="c0-info" class="latest-image-info"></div>
                            <div id="c0-status"></div>
                        </div>
                    </div>
                </div>
                <!--
                    C{n}_small.jpg/C{n}_center.jpg/C{n}_full.jpg/C{n}_info.txt
                    are written by the same external dark+flat-correction
                    process bart-monitor.html relies on, as sibling files in
                    this page's own directory - the user confirmed these
                    already work correctly for D50's own deployment ("the
                    images are OK"), so the relative-path convention is kept
                    exactly as-is rather than re-verified via a guessed
                    /images/ absolute path (which 404s - that's simply not
                    where this page or its sibling files actually live).
                    C1 is not here any more: it is D50's guide camera (its
                    own SCRIPT value runs /etc/rts2/guide.py, confirmed live)
                    rather than a second science camera, and that external
                    pipeline never had a current frame to give it - what the
                    box actually showed was whichever image C1 last took as
                    something other than a guider, which is to say a very old
                    one. Its live view is the Guiding panel below, fed by the
                    guide script itself.
                -->
            </div>

            <div class="guide-panel">
                <h3 style="margin-top: 0;">
                    Guiding - C1
                    <span id="guide-ranges" class="cloud-ranges">
                        <button data-hours="2" onclick="setGuideRange(2)">2 h</button>
                        <button data-hours="8" onclick="setGuideRange(8)">8 h</button>
                        <button data-hours="24" onclick="setGuideRange(24)">24 h</button>
                    </span>
                </h3>
                <!--
                    Three views of the same thing, because they answer
                    different questions: the cutout says whether there is a
                    star and what it looks like (FWHM: seeing, or focus), the
                    strip chart says whether the last few minutes were quiet,
                    and the scatter says whether the errors are centred or
                    the mount is being pulled one way. All of it comes from
                    values the guide script publishes on C1 itself -
                    guide_dx/guide_dy/guide_fwhm/guide_stars, plus
                    guide_last_image naming the frame - so the live half
                    needs no database at all. The history plot underneath is
                    the same series after rts2-recordd has sampled them into
                    records_double, read back through /api/db/records exactly
                    like the cloud panel: that daemon has to be running and
                    configured for C1 or only the live half will have
                    anything in it.
                -->
                <div class="guide-grid">
                    <div>
                        <img id="guide-frame-img" alt="last guiding frame"
                             title="last kept guiding frame - click to enlarge">
                        <div id="guide-readout" class="guide-readout"></div>
                    </div>
                    <canvas id="guide-live"></canvas>
                    <canvas id="guide-scatter"></canvas>
                </div>
                <canvas id="guide-history"></canvas>
                <div id="guide-status" class="cloud-status"></div>
                <div id="c1-status" class="guide-readout" style="margin-top: 6px;"></div>
            </div>
        </div>

        <div class="webcam-panel">
            <h3 style="margin-top: 0;">
                Webcams
                <button id="equalize-btn" onclick="toggleEqualize()" style="font-size: 11px; padding: 3px 8px; margin-left: 10px;">equalize</button>
                <button id="live-btn" onclick="toggleLive()" style="font-size: 11px; padding: 3px 8px; margin-left: 6px;">live</button>
            </h3>
            <div class="webcam-grid">
                <div class="webcam-column">
                    <div>AllSky (BART)</div>
                    <img id="webcam-allsky" data-cam="allsky" alt="AllSky">
                </div>
                <div class="webcam-column">
                    <div>Axis50</div>
                    <img id="webcam-axis50" data-cam="axis50" alt="Axis50">
                </div>
                <div class="webcam-column">
                    <div>Sentinel50</div>
                    <img id="webcam-sentinel50" data-cam="sentinel50" alt="Sentinel50">
                </div>
                <div class="webcam-column">
                    <div>CCTV (BART)</div>
                    <img id="webcam-cctv" data-cam="cctv" alt="CCTV">
                </div>
            </div>
            <!--
                AllSky and CCTV are BART's own cameras (shared site-wide,
                not D50-specific) - same files bart-monitor.html itself
                uses, fetched cross-origin from lascaux.asu.cas.cz since
                this page is served from D50/lascaux50's own vhost.
                Axis50/Sentinel50 are D50-native (relative /webcam/ path,
                confirmed live directly on lascaux50's Apache, real
                directory listing checked - not guessed). Two real,
                confirmed quirks in their naming, unlike BART's cameras:
                small snapshots are .jpg but the *full-size* images are
                .png, not .jpg (axis50's non-eq full is the one exception,
                still .jpg) - each entry's full/fullEq below reflects
                exactly what 200s, not a guessed extension. Neither has a
                working live stream: D50's AllSky-D65 (a third, separate
                camera the previous version of this page also showed)
                requires HTTP auth this page has no business embedding
                (401, confirmed) - dropped entirely, same call
                bart-monitor.html already made for its own Sentinel
                camera. Axis50/Sentinel50's own live-video endpoints
                (/observ/axis50/video.cgi, /observ/sentinel50/video.mjpg)
                are also 401-gated - confirmed, not assumed - so, same as
                BART's Sentinel, they fall back to their regular
                (auth-free) snapshot even with "live" toggled on.
            -->
        </div>

        <div class="cloud-panel">
            <h3 style="margin-top: 0;">
                Cloud sensor - sky temperature difference
                <span id="cloud-ranges" class="cloud-ranges">
                    <button data-hours="8" onclick="setCloudRange(8)">8 h</button>
                    <button data-hours="24" onclick="setCloudRange(24)">24 h</button>
                    <button data-hours="72" onclick="setCloudRange(72)">3 d</button>
                </span>
            </h3>
            <!--
                Drawn here from this site's own rts2-httpd
                (/api/db/records) instead of the embedded
                /images/graph/CLOUD/TEMP_DIFF JPEG this panel used to
                carry: that plotter lived inside classic httpd and went
                away with it when D50 moved to rts2ng, which is exactly
                what made this panel go blank. The history now comes from
                the recvals/records_* tables rts2-recordd fills, so that
                daemon has to be running on this host for anything to
                appear (db/STATUS.md). Same sensor and same 8 h default
                the old image used; the range buttons are new, and the
                choice is remembered in a cookie like the page's other
                preferences.
            -->
            <canvas id="cloud-canvas"></canvas>
            <div id="cloud-status" class="cloud-status"></div>
        </div>
    </div>

    <script>
        // Talks directly to rts2ng's rts2-httpd (task 2's JSON API) -
        // reads are unauthenticated by that daemon's own design
        // (STATUS.md task 6), so this page embeds no credentials at all
        // (unlike the classic D50 monitor.html this replaces, which
        // embedded plaintext dome-control credentials for a Sentinel
        // relay - dropped entirely, not carried forward).
        const API_BASE = '/images/api';

        // Plain vs "_eq" (locally contrast-equalized) filenames for each
        // webcam. allsky/cctv are BART's shared cameras, same file
        // layout bart-monitor.html itself uses (small/full both .jpg).
        // axis50/sentinel50 are D50-native - confirmed live via a real
        // directory listing on lascaux50's own Apache (not guessed):
        // small snapshots are .jpg, but full-size images are .png except
        // axis50's plain (non-eq) full, which is .jpg. `live` is only set
        // where a working stream was actually confirmed (cctv, via
        // lascaux's existing webcam4 proxy) - axis50/sentinel50's own
        // video endpoints 401 (HTTP auth this page won't embed), same
        // situation bart-monitor.html already documented for its own
        // Sentinel camera, so those two have no `live` entry and always
        // fall back to their regular snapshot.
        const WEBCAMS = [
            { id: 'allsky', label: 'AllSky',
                small: 'allsky_small.jpg', smallEq: 'allsky_eq_small.jpg',
                full: 'allsky.jpg', fullEq: 'allsky_eq.jpg',
                host: 'https://lascaux.asu.cas.cz/webcam/',
                live: 'https://lascaux.asu.cas.cz/webcam2/?action=stream' },
            { id: 'axis50', label: 'Axis50',
                small: 'axis-sum1_av_small.jpg', smallEq: 'axis-sum1_av_eq_small.jpg',
                full: 'axis-sum1_av.jpg', fullEq: 'axis-sum1_av_eq.png',
                host: '/webcam/' },
            { id: 'sentinel50', label: 'Sentinel50',
                small: 'sentinel-sum1_av_small.jpg', smallEq: 'sentinel-sum1_av_eq_small.jpg',
                full: 'sentinel-sum1_av.png', fullEq: 'sentinel-sum1_av_eq.png',
                host: '/webcam/' },
            { id: 'cctv', label: 'CCTV',
                small: 'webcam4_small.jpg', smallEq: 'webcam4_detail.jpg',
                full: 'webcam4.jpg', fullEq: 'webcam4_detail.jpg',
                host: 'https://lascaux.asu.cas.cz/webcam/',
                live: 'https://lascaux.asu.cas.cz/webcam4/?action=stream' },
        ];

        // D50's real device list (confirmed via /api/devices against the
        // live daemon, not assumed to mirror BART's): cameras C0/C1 (not
        // C1/C2/C3), focusers F0/F1, DISK_D50/D50UPS (not DISK_BART/
        // BARTUPS) - but the *same* WEATHER_BART/RAIN_BART/CLOUD as
        // bart-monitor.html, since those are one shared site-wide
        // weather station, not per-telescope. D50 also exposes its own
        // supplementary WEATHER_D50/RAIN_D50 (a simpler on-site sensor -
        // no wind speed, no outdoor temp/humidity) and SHUTTER1 (OTA/
        // mirror temperature monitoring) - deliberately not surfaced
        // here, same "don't invent a panel bart-monitor.html has no
        // equivalent for" scope call as everywhere else in this port.
        let systemData = {
            centrald: {},
            EXEC: {}, T0: {}, DOME: {},
            C0: {}, C1: {},
            F0: {}, F1: {},
            IMGP: {},
            WEATHER_BART: {}, RAIN_BART: {}, CLOUD: {},
            DISK_D50: {}, D50UPS: {}
        };

        const DEVICES = Object.keys(systemData);

        // rts2ng's httpd uses the RTS2 value's own name as the JSON key
        // verbatim - some real value names contain a literal "." (e.g.
        // D50UPS's "ups.status", "battery.charge", confirmed identical to
        // BARTUPS's field names in this session's live check), which is a
        // flat key, not a nested object. Try the literal key first; only
        // fall back to dot-path traversal for genuinely nested data.
        function getNestedValue(obj, path) {
            if (obj && obj[path] !== undefined)
                return obj[path];
            return path.split('.').reduce((cur, key) => cur && cur[key] !== undefined ? cur[key] : undefined, obj);
        }

        function safeValue(obj, key, defaultVal = 'N/A') {
            const val = getNestedValue(obj, key);
            return val !== undefined ? val : defaultVal;
        }

        function fmt(val, digits = 1) {
            return typeof val === 'number' && !Number.isNaN(val) ? val.toFixed(digits) : 'N/A';
        }

        // rts2ng's httpd serializes RA/Dec-pair values (RTS2_VALUE_RADEC
        // et al) via their getDisplayValue() fallback - a single "ra dec"
        // space-separated string (e.g. "313.97 -40.09", or "nan nan" when
        // unset), not a {ra,dec} nested object. Confirmed against D50's
        // own live /api/get?d=T0 output (same wire format as BART's).
        function parseRaDec(str) {
            if (typeof str !== 'string')
                return [NaN, NaN];
            const parts = str.trim().split(/\s+/).map(Number);
            return parts.length === 2 ? parts : [NaN, NaN];
        }

        function formatTime(timeVal) {
            return typeof timeVal === 'number' ? new Date(timeVal * 1000).toLocaleString() : 'N/A';
        }

        async function fetchDeviceData(deviceName) {
            try {
                const res = await fetch(`${API_BASE}/get?d=${deviceName}`);
                if (!res.ok)
                    throw new Error(`${res.status}`);
                const data = await res.json();
                return data.d || data;
            } catch (e) {
                console.error(`Failed to fetch ${deviceName}:`, e);
                return null;
            }
        }

        async function updateAllDeviceData() {
            await Promise.all(DEVICES.map(async device => {
                const data = await fetchDeviceData(device);
                if (data)
                    systemData[device] = data;
            }));
        }

        // rts2ng's /api/getall,get always send a selection value (e.g.
        // "filter") as its bare numeric index - fetched once per camera
        // via /api/selval and cached. C1 is D50's guide camera and may
        // not carry a real filter-wheel selection value at all (its live
        // data has filter=0 but empty filter_offsets) - handled the same
        // way an unreachable/non-selection value already is below: the
        // fetch just returns nothing useful and the raw index (or N/A)
        // is shown instead, no special-casing needed.
        const filterNames = { C0: null, C1: null };

        async function loadFilterNames() {
            await Promise.all(['C0', 'C1'].map(async cam => {
                if (filterNames[cam])
                    return;
                try {
                    const res = await fetch(`${API_BASE}/selval?d=${cam}&n=filter`);
                    if (!res.ok)
                        return;
                    filterNames[cam] = await res.json();
                } catch (e) {
                    console.error(`Failed to fetch filter names for ${cam}:`, e);
                }
            }));
        }

        function updateTelescopeStatus() {
            const div = document.getElementById('telescope-status');
            const currentName = safeValue(systemData.EXEC, 'current_name', '');
            const current = safeValue(systemData.EXEC, 'current', -1);
            const nextName = safeValue(systemData.EXEC, 'next_name', '');
            const [objRa, objDec] = parseRaDec(safeValue(systemData.T0, 'OBJ', ''));
            const airmass = safeValue(systemData.T0, 'AIRMASS', NaN);
            const tracking = safeValue(systemData.T0, 'TRACKING', 0) == 1;

            div.innerHTML = `
                <div class="status-value"><strong>Object:</strong> ${currentName || '(none)'} (${current})</div>
                <div class="status-value"><strong>Next:</strong> ${nextName || '(none)'}</div>
                <div class="status-value"><strong>Coordinates:</strong> ${fmt(objRa, 4)}&deg; ${fmt(objDec, 4)}&deg;</div>
                <div class="status-value"><strong>Airmass:</strong> ${fmt(airmass, 2)}</div>
                <div class="status-value"><strong>Tracking:</strong> <span class="${tracking ? 'good' : 'warn'}">${tracking ? 'On' : 'Off'}</span></div>
            `;
        }

        function updateDomeStatus() {
            const div = document.getElementById('dome-status');
            // D50's DOME uses plain roof_opened/roof_closed - confirmed
            // via live /api/get?d=DOME, *not* the south_roof_opened/
            // south_roof_closed names bart-monitor.html reads (BART's
            // dome genuinely has north/south roof halves; D50's is a
            // single roof with no north/south distinction at all).
            const opened = safeValue(systemData.DOME, 'roof_opened', 0) == 1;
            const closed = safeValue(systemData.DOME, 'roof_closed', 0) == 1;
            const weatherOpen = safeValue(systemData.DOME, 'weather_open', 0) == 1;
            div.innerHTML = `
                <div class="status-value"><strong>Roof:</strong> <span class="${opened ? 'warn' : 'good'}">${opened ? 'Open' : (closed ? 'Closed' : 'Moving/unknown')}</span></div>
                <div class="status-value"><strong>Weather allows opening:</strong> <span class="${weatherOpen ? 'good' : 'warn'}">${weatherOpen ? 'Yes' : 'No'}</span></div>
            `;
        }

        function updateCameraStatus() {
            for (const cam of ['C0', 'C1']) {
                const div = document.getElementById(cam.toLowerCase() + '-status');
                const d = systemData[cam];
                const object = safeValue(d, 'OBJECT', '');
                const exposure = safeValue(d, 'exposure', NaN);
                const exposureEnd = safeValue(d, 'exposure_end', NaN);
                const filterIdx = safeValue(d, 'filter', -1);
                const names = filterNames[cam];
                const filter = (names && names[filterIdx] !== undefined) ? names[filterIdx] : (filterIdx === -1 ? 'N/A' : filterIdx);
                const ccdTemp = safeValue(d, 'CCD_TEMP', NaN);
                const focName = safeValue(d, 'focuser', '');
                const focPos = safeValue(systemData[focName] || {}, 'FOC_POS', 'N/A');
                // IMGP's fwhm_C0 is only populated by the image processing
                // pipeline when it's actually running, same caveat
                // bart-monitor.html notes for its own cameras. C1 is a
                // guide camera - IMGP has no fwhm_C1 at all (confirmed
                // live) - but the guide script measures the FWHM of the
                // star it is guiding on and publishes it on the camera
                // itself, so for C1 that is the number to show.
                const fwhm = safeValue(d, 'guide_fwhm', safeValue(systemData.IMGP, `fwhm_${cam}`, NaN));

                div.innerHTML = `
                    <div class="status-value">${object || '(idle)'}</div>
                    <div class="status-value">Exp: ${fmt(exposure)} s</div>
                    <div class="status-value">Ends: ${formatTime(exposureEnd)}</div>
                    <div class="status-value">Filter: ${filter}</div>
                    <div class="status-value">FWHM: ${fmt(fwhm, 2)}</div>
                    <div class="status-value">CCD: ${fmt(ccdTemp, 1)}&deg;C</div>
                    <div class="status-value">Focus (${focName}): ${focPos}</div>
                `;
            }
        }

        // Latest per-camera image, via the same external dark+flat
        // correction process (C{n}_small.jpg/C{n}_center.jpg/
        // C{n}_info.txt, sibling files in this page's own directory).
        // Plain cache-busted <img> reloads, no rts2ng API/DB call at all.
        function reloadCameraImages() {
            const t = new Date().getTime();
            // C0 only: C1's box is gone (see the Guiding panel), and its
            // C1_small.jpg/C1_center.jpg never had anything current in
            // them anyway.
            for (const cam of ['C0']) {
                const c = cam.toLowerCase();
                document.getElementById(c + '-image').src = `${cam}_small.jpg?t=${t}`;
                document.getElementById(c + '-center').src = `${cam}_center.jpg?t=${t}`;
            }
        }

        // The caption needs the same `?t=` cache-buster the <img> reloads
        // above already carry.  Apache serves these files with only
        // Last-Modified/ETag - no Cache-Control - so a plain fetch() is
        // subject to heuristic freshness (~10% of the file's age), and the
        // browser will happily serve a stale C{n}_info.txt without even
        // revalidating.  That bites hardest at the start of a night: the
        // file is then ~15 h old, so the heuristic pins it for over an
        // hour while the pictures next to it refresh every 15 s - exactly
        // the "picture is current but the caption is from last night"
        // report this came from.
        function updateImageInfo() {
            const t = new Date().getTime();
            for (const cam of ['C0']) {
                const el = document.getElementById(cam.toLowerCase() + '-info');
                fetch(`${cam}_info.txt?t=${t}`)
                    .then(res => res.text())
                    .then(text => { el.textContent = text.trim(); })
                    .catch(() => { el.textContent = ''; });
            }
        }

        function updateWeatherStatus() {
            const div = document.getElementById('weather-status');
            const rain = safeValue(systemData.RAIN_BART, 'rain', 0) == 1;
            const rainStr = rain ? '<span class="error">YES</span>' : '<span class="good">No</span>';

            const tempOut = safeValue(systemData.WEATHER_BART, 'TEMP_OUT', NaN);
            const humOut = safeValue(systemData.WEATHER_BART, 'HUM_OUT', NaN);
            const tempDome = safeValue(systemData.WEATHER_BART, 'TEMP_DOME', NaN);
            const humDome = safeValue(systemData.WEATHER_BART, 'HUM_DOME', NaN);
            const windSpeed = safeValue(systemData.WEATHER_BART, 'WIND_SPEED', NaN);
            const windPeak = safeValue(systemData.WEATHER_BART, 'WIND_SPEED_PEAK', NaN);

            const cloudDiff = safeValue(systemData.CLOUD, 'TEMP_DIFF', NaN);
            const tempAmb = safeValue(systemData.CLOUD, 'TEMP_AMB', NaN);
            const tempSky = safeValue(systemData.CLOUD, 'TEMP_SKY', NaN);
            const heater = safeValue(systemData.CLOUD, 'HEATER', 0) == 1;

            // DISK_D50/D50UPS - same field names as BART's DISK_BART/
            // BARTUPS (confirmed live), just the device renamed.
            const diskFree = safeValue(systemData.DISK_D50, 'free', NaN);
            const diskFreeGB = typeof diskFree === 'number' ? (diskFree / 1e9).toFixed(1) : diskFree;

            const upsStatus = safeValue(systemData.D50UPS, 'ups.status', 'N/A');
            const upsLoad = safeValue(systemData.D50UPS, 'ups.load', NaN);
            const upsCharge = safeValue(systemData.D50UPS, 'battery.charge', NaN);
            const onBattery = upsStatus !== 'OL';

            div.innerHTML = `
                <div class="status-value"><strong>Rain?:</strong> ${rainStr}</div>
                <div class="status-value"><strong>Cloud coverage:</strong> ${fmt(cloudDiff)} (${fmt(tempAmb)} - ${fmt(tempSky)})</div>
                <div class="status-value"><strong>Cloud heater:</strong> ${heater ? 'on' : 'off'}</div>
                <div class="status-value"><strong>Wind:</strong> ${fmt(windSpeed)} m/s, peak ${fmt(windPeak)} m/s</div>

                <table class="temp-table">
                    <tr><th></th><th>Out</th><th>Dome</th></tr>
                    <tr><th>Temp [&deg;C]</th><td>${fmt(tempOut)}</td><td>${fmt(tempDome)}</td></tr>
                    <tr><th>Hum [%]</th><td>${fmt(humOut)}</td><td>${fmt(humDome)}</td></tr>
                </table>

                <div class="status-value"><strong>Disk free:</strong> ${diskFreeGB} GB</div>
                <div class="status-value"><strong>UPS:</strong> <span class="${onBattery ? 'error' : 'good'}">${upsStatus}</span> - load ${fmt(upsLoad)}%, charge ${fmt(upsCharge, 0)}%</div>
            `;
        }

        // centrald's on/standby/off - not a named Value, it's the raw
        // RTS2 protocol state (SERVERD_ONOFF_MASK, status.h), which
        // rts2-httpd includes as a "state" field alongside every
        // device's values. Same convention as bart-monitor.html.
        function updateServerdStatus() {
            const el = document.getElementById('serverd-status');
            const state = safeValue(systemData.centrald, 'state', NaN);
            if (Number.isNaN(state)) {
                el.textContent = 'N/A';
                el.className = '';
                return;
            }
            const [text, cls] = {
                0x000: ['ON', 'good'],
                0x010: ['STANDBY', 'standby'],
                0x020: ['OFF (soft)', 'error'],
                0x030: ['OFF (hard)', 'error'],
            }[state & 0x030] || ['N/A', ''];
            el.textContent = text;
            el.className = cls;
        }

        async function updateStatus() {
            await Promise.all([updateAllDeviceData(), loadFilterNames()]);
            updateServerdStatus();
            updateTelescopeStatus();
            updateDomeStatus();
            updateCameraStatus();
            updateWeatherStatus();
            drawSkyChart();
        }

        function reloadWebcams() {
            const t = new Date().getTime();
            for (const cam of WEBCAMS) {
                const el = document.getElementById(`webcam-${cam.id}`);
                if (liveWebcams && cam.live) {
                    // Setting an <img> to the same src it already has is
                    // a no-op in every browser (no re-fetch), so this
                    // 15s-interval call doesn't reconnect the stream -
                    // only the initial toggleLive() switch does.
                    el.src = cam.live;
                } else {
                    const src = equalizeWebcams ? cam.smallEq : cam.small;
                    el.src = `${cam.host}${src}?t=${t}`;
                }
            }
        }

        function webcamFullSrc(cam) {
            if (liveWebcams && cam.live)
                return cam.live;
            return `${cam.host}${equalizeWebcams ? cam.fullEq : cam.full}`;
        }

        // Cloud sensor history, plotted client-side from rts2-httpd's
        // /api/db/records (the series rts2-recordd stores) - the
        // replacement for classic httpd's server-rendered
        // /images/graph/DEVICE/VALUE JPEG this page used to embed, and
        // the "client-side canvas plot fed by a JSON time-series
        // endpoint" the old TODO here asked for. web/static/records.js
        // is the general-purpose version of the same idea; this is the
        // one-sensor cut of it, kept inside the page because these site
        // pages are deliberately standalone single files.
        const CLOUD_DEVICE = 'CLOUD';
        const CLOUD_VALUE = 'TEMP_DIFF';

        let cloudHours = parseFloat(getCookie('cloudHours')) || 8;
        let cloudSeries = null;

        function setCloudRange(hours) {
            cloudHours = hours;
            setCookie('cloudHours', String(hours));
            reloadCloudGraph();
        }

        function updateCloudButtons() {
            for (const b of document.querySelectorAll('#cloud-ranges button'))
                b.classList.toggle('active', parseFloat(b.dataset.hours) === cloudHours);
        }

        async function reloadCloudGraph() {
            const canvas = document.getElementById('cloud-canvas');
            const status = document.getElementById('cloud-status');
            if (!canvas || !status)
                return;
            updateCloudButtons();

            const to = Math.round(new Date().getTime() / 1000);
            const from = Math.round(to - cloudHours * 3600);
            // One point per canvas pixel is all the plot can show; more
            // just makes the response bigger. The daemon buckets the
            // rest away server-side (avg/min/max per bucket).
            const points = Math.max(200, Math.round(canvas.clientWidth || 900));

            try {
                const res = await fetch(`${API_BASE}/db/records?device=${CLOUD_DEVICE}&value=${CLOUD_VALUE}&from=${from}&to=${to}&points=${points}`);
                const data = await res.json();
                if (data.error)
                    throw new Error(data.error);
                cloudSeries = data;
                const last = data.points.length ? data.points[data.points.length - 1] : null;
                if (last) {
                    const age = Math.round(to - last[0]);
                    status.className = 'cloud-status';
                    status.textContent = `${CLOUD_DEVICE}.${CLOUD_VALUE} = ${last[1].toFixed(2)} `
                        + `(${age < 120 ? age + ' s' : Math.round(age / 60) + ' min'} ago), `
                        + `${data.points.length} points over ${cloudHours} h`;
                } else {
                    status.className = 'cloud-status warn';
                    status.textContent = `nothing recorded in the last ${cloudHours} h`;
                }
            } catch (e) {
                cloudSeries = null;
                status.className = 'cloud-status warn';
                status.textContent = `cannot load cloud history: ${e.message}`
                    + ` - is rts2-recordd running and recording ${CLOUD_DEVICE}.${CLOUD_VALUE}?`;
            }
            drawCloudGraph();
        }

        function cloudNiceStep(raw) {
            const exp = Math.pow(10, Math.floor(Math.log10(raw)));
            const norm = raw / exp;
            if (norm <= 1) return exp;
            if (norm <= 2) return 2 * exp;
            if (norm <= 5) return 5 * exp;
            return 10 * exp;
        }

        // Sun altitude at an arbitrary time, for shading the cloud graph
        // by day/twilight/night - the same low-precision ephemeris
        // renderSkyChart() already uses for the Sun marker (julianDate/
        // gmstDeg/sunEquatorial/equToHrz below), just evaluated at any
        // time rather than "now". Cloudmeter readings mean something
        // different in daylight than at night, hence marking which is
        // which rather than adding a new astronomy stack for it.
        function sunAltDeg(t) {
            if (!horizonInfo)
                return null;
            const jd = julianDate(new Date(t * 1000));
            const sun = sunEquatorial(jd);
            const lst = normDeg(gmstDeg(jd) + horizonInfo.lon);
            return equToHrz(lst - sun.ra, sun.dec, horizonInfo.lat).alt;
        }

        // Splits [tMin, tMax] into contiguous {from, to, band} runs of
        // 'day' | 'twilight' | 'night', using the same night_horizon/
        // day_horizon thresholds RTS2 itself classifies night by
        // (/api/horizon) - this is what "night" means to RTS2, not a
        // fixed astronomical-twilight constant. 3-minute sampling: fine
        // enough that even a short twilight near the equator still gets
        // its own band, coarse enough that even a multi-day range is a
        // few hundred trig evaluations.
        function dayNightBands(tMin, tMax) {
            if (!horizonInfo || horizonInfo.nightHorizon === undefined)
                return [];
            const classify = alt => alt > horizonInfo.dayHorizon ? 'day'
                : (alt > horizonInfo.nightHorizon ? 'twilight' : 'night');

            const step = 180;
            const bands = [];
            let segStart = tMin;
            let segClass = classify(sunAltDeg(tMin));
            for (let t = tMin + step; t < tMax; t += step) {
                const cls = classify(sunAltDeg(t));
                if (cls !== segClass) {
                    bands.push({ from: segStart, to: t, band: segClass });
                    segStart = t;
                    segClass = cls;
                }
            }
            bands.push({ from: segStart, to: tMax, band: segClass });
            return bands;
        }

        function drawCloudGraph() {
            const canvas = document.getElementById('cloud-canvas');
            if (!canvas)
                return;
            const ctx = canvas.getContext('2d');
            // backing store in device pixels, box in layout pixels -
            // otherwise the plot is blurry on any HiDPI screen
            const ratio = window.devicePixelRatio || 1;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            canvas.width = Math.round(width * ratio);
            canvas.height = Math.round(height * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.clearRect(0, 0, width, height);

            // colours off the page's own CSS variables, so the plot
            // follows dark mode with everything else
            const style = getComputedStyle(document.body);
            const fg = style.getPropertyValue('--text-muted').trim() || '#555';
            const grid = style.getPropertyValue('--border').trim() || '#ccc';
            const line = style.getPropertyValue('--graph-line').trim() || '#2563eb';
            const band = style.getPropertyValue('--graph-band').trim() || 'rgba(37,99,235,0.18)';
            const dayBg = style.getPropertyValue('--graph-day-bg').trim() || 'rgba(255,190,40,0.12)';
            const twilightBg = style.getPropertyValue('--graph-twilight-bg').trim() || 'rgba(37,99,235,0.08)';

            if (!cloudSeries || !cloudSeries.points.length) {
                ctx.fillStyle = fg;
                ctx.font = '12px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('no data', width / 2, height / 2);
                return;
            }

            const pts = cloudSeries.points;
            const x0 = 44, x1 = width - 8, y0 = 10, y1 = height - 20;
            if (x1 <= x0 || y1 <= y0)
                return;

            const tMin = cloudSeries.from, tMax = cloudSeries.to;
            let vMin = Infinity, vMax = -Infinity;
            for (const p of pts) {
                for (const v of [p[1], p[2], p[3]]) {
                    if (v === null || !isFinite(v)) continue;
                    if (v < vMin) vMin = v;
                    if (v > vMax) vMax = v;
                }
            }
            if (!isFinite(vMin) || !isFinite(vMax)) { vMin = 0; vMax = 1; }
            if (vMin === vMax) { vMin -= 0.5; vMax += 0.5; }
            else { const m = (vMax - vMin) * 0.05; vMin -= m; vMax += m; }

            const sx = t => x0 + (t - tMin) / (tMax - tMin) * (x1 - x0);
            const sy = v => y1 - (v - vMin) / (vMax - vMin) * (y1 - y0);

            // day/twilight/night background, drawn before anything else
            // so grid, band and line all stay fully legible on top of it
            // - night gets no fill at all (unchanged from before this
            // existed), day and twilight get a minimal tint
            for (const seg of dayNightBands(tMin, tMax)) {
                if (seg.band === 'night')
                    continue;
                ctx.fillStyle = seg.band === 'day' ? dayBg : twilightBg;
                ctx.fillRect(sx(seg.from), y0, sx(seg.to) - sx(seg.from), y1 - y0);
            }

            ctx.strokeStyle = grid;
            ctx.fillStyle = fg;
            ctx.lineWidth = 1;
            ctx.font = '10px Arial, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            const yStep = cloudNiceStep((vMax - vMin) / 4);
            for (let v = Math.ceil(vMin / yStep) * yStep; v <= vMax; v += yStep) {
                const y = Math.round(sy(v)) + 0.5;
                ctx.beginPath();
                ctx.moveTo(x0, y);
                ctx.lineTo(x1, y);
                ctx.stroke();
                // decimals from the step, not a fixed guess: a clear
                // night's TEMP_DIFF can move by 0.05 between gridlines,
                // and one decimal prints every one of them as "9.2"
                const dec = Math.max(0, Math.min(4, Math.ceil(-Math.log10(yStep))));
                ctx.fillText(v.toFixed(dec), x0 - 6, y);
            }

            ctx.textBaseline = 'top';
            const xStep = cloudNiceStep((tMax - tMin) / 6);
            for (let t = Math.ceil(tMin / xStep) * xStep; t <= tMax; t += xStep) {
                const x = Math.round(sx(t)) + 0.5;
                ctx.beginPath();
                ctx.moveTo(x, y0);
                ctx.lineTo(x, y1);
                ctx.stroke();
                const d = new Date(t * 1000);
                const label = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
                // the outermost labels are aligned inwards, or they hang
                // off the canvas and get clipped mid-digit
                const half = ctx.measureText(label).width / 2;
                ctx.textAlign = x + half > width ? 'right' : (x - half < 0 ? 'left' : 'center');
                ctx.fillText(label, x, y1 + 4);
            }

            // spread inside each bucket, where the range was downsampled
            if (pts.some(p => p[4] > 1)) {
                ctx.fillStyle = band;
                ctx.beginPath();
                let started = false;
                for (const p of pts) {
                    if (p[3] === null || !isFinite(p[3])) continue;
                    const x = sx(p[0]), y = sy(p[3]);
                    started ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                    started = true;
                }
                for (let i = pts.length - 1; i >= 0; i--) {
                    const p = pts[i];
                    if (p[2] === null || !isFinite(p[2])) continue;
                    ctx.lineTo(sx(p[0]), sy(p[2]));
                }
                ctx.closePath();
                ctx.fill();
            }

            // a gap in the data stays a gap rather than being bridged by
            // a line nobody measured
            ctx.strokeStyle = line;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            let pen = false;
            for (const p of pts) {
                if (p[1] === null || !isFinite(p[1])) { pen = false; continue; }
                const x = sx(p[0]), y = sy(p[1]);
                pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                pen = true;
            }
            ctx.stroke();
        }

        // --- Guiding (C1) --------------------------------------------------
        // The guide script (/etc/rts2/guide.py) publishes its own numbers
        // on the guide camera - guide_dx/guide_dy (pixels), the pulses it
        // sent, how many stars it matched, the FWHM of the star it
        // measured, guide_scale to turn any of that into arcsec, and
        // guide_last_image naming the frame it kept. That makes the live
        // half of this panel a plain value read: no database, no image
        // pipeline, nothing to go stale behind the page's back. NaN on
        // the bus arrives here as null (rts2-httpd sends no `nan` token,
        // which JSON has no room for), and null means "not guiding" -
        // never "same as last time".
        const GUIDE_CAM = 'C1';
        // /preview/<path>?ps= is the same daemon and the same proxy path
        // as the API, one step up: /images/api -> /images/preview.
        const PREVIEW_BASE = API_BASE.replace(/\/api$/, '/preview');
        const GUIDE_LIVE_SECONDS = 300;

        let guideLive = [];              // {t, dx, dy, fwhm, n} for the last 5 min
        let guideLastImage = null;
        let guideScale = null;           // arcsec/pixel, as published by the camera
        let guideActive = false;
        let guideHistory = null;         // {dx: series, dy: series} from /api/db/records
        let guideHours = parseFloat(getCookie('guideHours')) || 8;

        function numOrNull(v) {
            return typeof v === 'number' && isFinite(v) ? v : null;
        }

        function setGuideRange(hours) {
            guideHours = hours;
            setCookie('guideHours', String(hours));
            reloadGuideHistory();
        }

        function updateGuideButtons() {
            for (const b of document.querySelectorAll('#guide-ranges button'))
                b.classList.toggle('active', parseFloat(b.dataset.hours) === guideHours);
        }

        async function pollGuide() {
            const data = await fetchDeviceData(GUIDE_CAM);
            const status = document.getElementById('guide-status');
            if (!data) {
                status.className = 'cloud-status warn';
                status.textContent = `cannot reach ${GUIDE_CAM}`;
                return;
            }
            systemData[GUIDE_CAM] = data;

            if (data.guide_dx === undefined) {
                // The camera is there but carries no guiding values at
                // all - the script that creates them has not run yet
                // (they appear on its first exposure and stay for the
                // rest of the session), or it is an older copy of it.
                status.className = 'cloud-status warn';
                status.textContent = `${GUIDE_CAM} publishes no guiding telemetry`
                    + ' - guide.py creates guide_dx/guide_dy/... on its first frame';
                guideActive = false;
                return;
            }

            guideScale = numOrNull(data.guide_scale) || guideScale;

            const now = Date.now() / 1000;
            const sample = {
                t: now,
                dx: numOrNull(data.guide_dx),
                dy: numOrNull(data.guide_dy),
                fwhm: numOrNull(data.guide_fwhm),
                n: numOrNull(data.guide_stars)
            };
            guideActive = sample.dx !== null || sample.dy !== null;
            guideLive.push(sample);
            while (guideLive.length && guideLive[0].t < now - GUIDE_LIVE_SECONDS)
                guideLive.shift();

            const path = typeof data.guide_last_image === 'string' ? data.guide_last_image : '';
            if (path && path !== guideLastImage) {
                guideLastImage = path;
                // Same encoding the archive thumbnails use: each path
                // segment separately, so the slashes survive.
                const url = `${PREVIEW_BASE}/${path.split('/').map(encodeURIComponent).join('/')}`;
                document.getElementById('guide-frame-img').src = `${url}?ps=240`;
                document.getElementById('guide-frame-img').onclick =
                    () => openLightbox(`${url}?ps=900`, `${GUIDE_CAM} - ${path.split('/').pop()}`);
            }

            status.className = 'cloud-status';
            status.textContent = guideActive
                ? `guiding, ${guideLive.filter(p => p.dx !== null).length} samples in the last`
                    + ` ${Math.round(GUIDE_LIVE_SECONDS / 60)} min`
                : 'not guiding';

            updateGuideReadout();
            drawGuideLive();
            drawGuideScatter();
        }

        // Self-rescheduling rather than setInterval: guiding runs at
        // about 1 Hz and is worth following at that rate, but between
        // observations there is nothing to follow and no reason to ask
        // the daemon every second.
        function guideLoop() {
            pollGuide()
                .catch(e => console.error(e))
                .finally(() => setTimeout(guideLoop, guideActive ? 1000 : 5000));
        }

        function guideStats() {
            const pts = guideLive.filter(p => p.dx !== null && p.dy !== null);
            if (!pts.length)
                return null;
            const rms = key => Math.sqrt(pts.reduce((a, p) => a + p[key] * p[key], 0) / pts.length);
            const mean = key => pts.reduce((a, p) => a + p[key], 0) / pts.length;
            const fwhms = guideLive.map(p => p.fwhm).filter(v => v !== null).sort((a, b) => a - b);
            return {
                last: pts[pts.length - 1],
                rmsX: rms('dx'), rmsY: rms('dy'),
                meanX: mean('dx'), meanY: mean('dy'),
                fwhm: fwhms.length ? fwhms[Math.floor(fwhms.length / 2)] : null,
                count: pts.length
            };
        }

        // Pixels are what the script measures; arcsec is what anyone
        // reading this actually wants, and the conversion is the
        // camera's own guide_scale rather than a copy of the constant
        // kept here - one number, defined in one place.
        function guideArcsec(px, digits = 2) {
            return guideScale && px !== null ? ` (${(px * guideScale).toFixed(digits)}")` : '';
        }

        function guideArcsecPair(x, y, digits = 2) {
            return guideScale ? ` (${(x * guideScale).toFixed(digits)}"`
                + ` / ${(y * guideScale).toFixed(digits)}")` : '';
        }

        function updateGuideReadout() {
            const el = document.getElementById('guide-readout');
            const st = guideStats();
            if (!st) {
                el.innerHTML = '<span class="big">idle</span><br>no guiding errors measured'
                    + ` in the last ${Math.round(GUIDE_LIVE_SECONDS / 60)} min`;
                return;
            }
            const stars = st.last.n === null ? 'N/A' : st.last.n.toFixed(0);
            const lost = st.last.n !== null && st.last.n < 1;
            el.innerHTML = `
                <span class="big">${st.last.dx.toFixed(2)} / ${st.last.dy.toFixed(2)} px</span>
                ${guideArcsecPair(st.last.dx, st.last.dy)}<br>
                RMS ${st.rmsX.toFixed(2)} / ${st.rmsY.toFixed(2)} px over ${st.count} samples<br>
                mean ${st.meanX.toFixed(2)} / ${st.meanY.toFixed(2)} px<br>
                FWHM <span class="big">${st.fwhm === null ? 'N/A' : st.fwhm.toFixed(2) + ' px'}</span>
                ${guideArcsec(st.fwhm)}<br>
                stars matched <span class="${lost ? 'big warn' : ''}">${stars}</span>
            `;
        }

        // Canvas boilerplate the three guiding plots share: backing store
        // in device pixels, drawing in layout pixels, palette off the
        // page's own CSS variables so everything follows dark mode.
        function guideCanvas(id) {
            const canvas = document.getElementById(id);
            if (!canvas || !canvas.clientWidth)
                return null;
            const ctx = canvas.getContext('2d');
            const ratio = window.devicePixelRatio || 1;
            const width = canvas.clientWidth, height = canvas.clientHeight;
            canvas.width = Math.round(width * ratio);
            canvas.height = Math.round(height * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.clearRect(0, 0, width, height);
            const style = getComputedStyle(document.body);
            return {
                ctx, width, height,
                fg: style.getPropertyValue('--text-muted').trim() || '#555',
                grid: style.getPropertyValue('--border').trim() || '#ccc',
                x: style.getPropertyValue('--graph-line').trim() || '#2563eb',
                y: style.getPropertyValue('--graph-line2').trim() || '#d97706',
                band: style.getPropertyValue('--graph-band').trim() || 'rgba(37,99,235,0.18)'
            };
        }

        function guideNoData(c, text) {
            c.ctx.fillStyle = c.fg;
            c.ctx.font = '12px Arial, sans-serif';
            c.ctx.textAlign = 'center';
            c.ctx.textBaseline = 'middle';
            c.ctx.fillText(text, c.width / 2, c.height / 2);
        }

        function drawGuideLive() {
            const c = guideCanvas('guide-live');
            if (!c)
                return;
            const now = Date.now() / 1000;
            const tMin = now - GUIDE_LIVE_SECONDS, tMax = now;
            const x0 = 34, x1 = c.width - 8, y0 = 8, y1 = c.height - 18;
            if (x1 <= x0 || y1 <= y0)
                return;

            // Symmetric around zero and never tighter than +-2 px: a
            // quiet night must look quiet, not get magnified into noise
            // filling the whole panel.
            let span = 2;
            for (const p of guideLive) {
                for (const v of [p.dx, p.dy])
                    if (v !== null) span = Math.max(span, Math.abs(v) * 1.15);
            }
            const sx = t => x0 + (t - tMin) / (tMax - tMin) * (x1 - x0);
            const sy = v => (y0 + y1) / 2 - v / span * (y1 - y0) / 2;

            c.ctx.strokeStyle = c.grid;
            c.ctx.fillStyle = c.fg;
            c.ctx.lineWidth = 1;
            c.ctx.font = '10px Arial, sans-serif';
            c.ctx.textAlign = 'right';
            c.ctx.textBaseline = 'middle';
            const step = cloudNiceStep(span / 2);
            for (let v = -Math.floor(span / step) * step; v <= span; v += step) {
                const y = Math.round(sy(v)) + 0.5;
                c.ctx.beginPath();
                c.ctx.moveTo(x0, y);
                c.ctx.lineTo(x1, y);
                c.ctx.stroke();
                c.ctx.fillText(v.toFixed(Math.max(0, Math.min(2, Math.ceil(-Math.log10(step))))), x0 - 5, y);
            }

            c.ctx.textAlign = 'center';
            c.ctx.textBaseline = 'top';
            for (let m = 0; m <= GUIDE_LIVE_SECONDS / 60; m++) {
                const x = Math.round(sx(now - m * 60)) + 0.5;
                c.ctx.beginPath();
                c.ctx.moveTo(x, y0);
                c.ctx.lineTo(x, y1);
                c.ctx.stroke();
                c.ctx.fillText(m ? `-${m}m` : 'now', x, y1 + 4);
            }

            if (!guideLive.some(p => p.dx !== null)) {
                guideNoData(c, 'not guiding');
                return;
            }

            // A pause in guiding is a gap, not a straight line drawn
            // across it - same rule the cloud plot follows, and the
            // reason the script publishes NaN when it stops.
            for (const key of ['dx', 'dy']) {
                c.ctx.strokeStyle = key === 'dx' ? c.x : c.y;
                c.ctx.lineWidth = 1.2;
                c.ctx.beginPath();
                let pen = false, lastT = 0;
                for (const p of guideLive) {
                    if (p[key] === null || p.t - lastT > 5) pen = false;
                    if (p[key] === null) continue;
                    const px = sx(p.t), py = sy(Math.max(-span, Math.min(span, p[key])));
                    pen ? c.ctx.lineTo(px, py) : c.ctx.moveTo(px, py);
                    pen = true;
                    lastT = p.t;
                }
                c.ctx.stroke();
            }

            c.ctx.textAlign = 'left';
            c.ctx.textBaseline = 'top';
            c.ctx.fillStyle = c.x;
            c.ctx.fillText('dx', x0 + 4, y0 + 1);
            c.ctx.fillStyle = c.y;
            c.ctx.fillText('dy', x0 + 22, y0 + 1);
        }

        // Where the errors sit relative to each other, oldest faintest:
        // a cloud around the origin is good guiding, a cloud somewhere
        // else is a systematic pull, and a smear is drift.
        function drawGuideScatter() {
            const c = guideCanvas('guide-scatter');
            if (!c)
                return;
            const pts = guideLive.filter(p => p.dx !== null && p.dy !== null);
            const size = Math.min(c.width, c.height);
            const cx = c.width / 2, cy = c.height / 2;
            let span = 2;
            for (const p of pts)
                span = Math.max(span, Math.abs(p.dx) * 1.15, Math.abs(p.dy) * 1.15);
            const scale = (size / 2 - 14) / span;

            c.ctx.strokeStyle = c.grid;
            c.ctx.fillStyle = c.fg;
            c.ctx.font = '10px Arial, sans-serif';
            c.ctx.lineWidth = 1;
            const ring = cloudNiceStep(span / 2);
            for (let r = ring; r <= span; r += ring) {
                c.ctx.beginPath();
                c.ctx.arc(cx, cy, r * scale, 0, 2 * Math.PI);
                c.ctx.stroke();
                if (cx + r * scale + 22 < c.width) {
                    c.ctx.textAlign = 'left';
                    c.ctx.textBaseline = 'bottom';
                    c.ctx.fillText(r.toFixed(1), cx + r * scale + 2, cy);
                }
            }
            c.ctx.beginPath();
            c.ctx.moveTo(cx - size / 2, cy); c.ctx.lineTo(cx + size / 2, cy);
            c.ctx.moveTo(cx, cy - size / 2); c.ctx.lineTo(cx, cy + size / 2);
            c.ctx.stroke();

            if (!pts.length) {
                guideNoData(c, 'not guiding');
                return;
            }

            const now = Date.now() / 1000;
            for (const p of pts) {
                const age = (now - p.t) / GUIDE_LIVE_SECONDS;
                c.ctx.globalAlpha = Math.max(0.08, 1 - age);
                c.ctx.fillStyle = c.x;
                c.ctx.beginPath();
                c.ctx.arc(cx + p.dx * scale, cy - p.dy * scale, age < 0.02 ? 3.5 : 1.8, 0, 2 * Math.PI);
                c.ctx.fill();
            }
            c.ctx.globalAlpha = 1;
            c.ctx.fillStyle = c.fg;
            c.ctx.textAlign = 'left';
            c.ctx.textBaseline = 'top';
            c.ctx.fillText('dx / dy [px], newest brightest', 4, 3);
        }

        // The night behind the live view: the same two values after
        // rts2-recordd has sampled them into the database. One request
        // per series - /api/db/records answers for one value at a time,
        // and buckets to avg/min/max server-side so a whole night still
        // arrives as one point per pixel column.
        async function reloadGuideHistory() {
            const canvas = document.getElementById('guide-history');
            if (!canvas)
                return;
            updateGuideButtons();
            const to = Math.round(Date.now() / 1000);
            const from = Math.round(to - guideHours * 3600);
            const points = Math.max(200, Math.round(canvas.clientWidth || 900));
            try {
                const series = await Promise.all(['guide_dx', 'guide_dy'].map(async name => {
                    const res = await fetch(`${API_BASE}/db/records?device=${GUIDE_CAM}`
                        + `&value=${name}&from=${from}&to=${to}&points=${points}`);
                    const data = await res.json();
                    if (data.error)
                        throw new Error(data.error);
                    return data;
                }));
                guideHistory = { from, to, dx: series[0], dy: series[1] };
            } catch (e) {
                guideHistory = { from, to, error: String(e.message || e) };
            }
            drawGuideHistory();
        }

        function drawGuideHistory() {
            const c = guideCanvas('guide-history');
            if (!c)
                return;
            if (!guideHistory) {
                guideNoData(c, 'loading...');
                return;
            }
            if (guideHistory.error) {
                guideNoData(c, `no guiding history: ${guideHistory.error}`
                    + ' - is rts2-recordd recording C1.guide_dx?');
                return;
            }

            const x0 = 34, x1 = c.width - 8, y0 = 8, y1 = c.height - 18;
            if (x1 <= x0 || y1 <= y0)
                return;
            const tMin = guideHistory.from, tMax = guideHistory.to;

            let span = 2;
            for (const s of [guideHistory.dx, guideHistory.dy]) {
                for (const p of s.points)
                    for (const v of [p[2], p[3]])
                        if (v !== null && isFinite(v)) span = Math.max(span, Math.abs(v) * 1.1);
            }
            const sx = t => x0 + (t - tMin) / (tMax - tMin) * (x1 - x0);
            const sy = v => (y0 + y1) / 2 - v / span * (y1 - y0) / 2;

            for (const seg of dayNightBands(tMin, tMax)) {
                if (seg.band === 'night')
                    continue;
                const style = getComputedStyle(document.body);
                c.ctx.fillStyle = seg.band === 'day'
                    ? (style.getPropertyValue('--graph-day-bg').trim() || 'rgba(255,190,40,0.12)')
                    : (style.getPropertyValue('--graph-twilight-bg').trim() || 'rgba(37,99,235,0.08)');
                c.ctx.fillRect(sx(seg.from), y0, sx(seg.to) - sx(seg.from), y1 - y0);
            }

            c.ctx.strokeStyle = c.grid;
            c.ctx.fillStyle = c.fg;
            c.ctx.lineWidth = 1;
            c.ctx.font = '10px Arial, sans-serif';
            c.ctx.textAlign = 'right';
            c.ctx.textBaseline = 'middle';
            const step = cloudNiceStep(span / 2);
            for (let v = -Math.floor(span / step) * step; v <= span; v += step) {
                const y = Math.round(sy(v)) + 0.5;
                c.ctx.beginPath();
                c.ctx.moveTo(x0, y);
                c.ctx.lineTo(x1, y);
                c.ctx.stroke();
                c.ctx.fillText(v.toFixed(Math.max(0, Math.min(2, Math.ceil(-Math.log10(step))))), x0 - 5, y);
            }

            c.ctx.textBaseline = 'top';
            const xStep = cloudNiceStep((tMax - tMin) / 6);
            for (let t = Math.ceil(tMin / xStep) * xStep; t <= tMax; t += xStep) {
                const x = Math.round(sx(t)) + 0.5;
                c.ctx.beginPath();
                c.ctx.moveTo(x, y0);
                c.ctx.lineTo(x, y1);
                c.ctx.stroke();
                const d = new Date(t * 1000);
                const label = String(d.getHours()).padStart(2, '0') + ':'
                    + String(d.getMinutes()).padStart(2, '0');
                const half = c.ctx.measureText(label).width / 2;
                c.ctx.textAlign = x + half > c.width ? 'right' : (x - half < 0 ? 'left' : 'center');
                c.ctx.fillText(label, x, y1 + 4);
            }

            let any = false;
            for (const [key, colour] of [['dx', c.x], ['dy', c.y]]) {
                const pts = guideHistory[key].points;
                c.ctx.strokeStyle = colour;
                c.ctx.lineWidth = 1.2;
                c.ctx.beginPath();
                let pen = false;
                for (const p of pts) {
                    if (p[1] === null || !isFinite(p[1])) { pen = false; continue; }
                    any = true;
                    const px = sx(p[0]), py = sy(Math.max(-span, Math.min(span, p[1])));
                    pen ? c.ctx.lineTo(px, py) : c.ctx.moveTo(px, py);
                    pen = true;
                }
                c.ctx.stroke();
            }

            if (!any)
                guideNoData(c, `nothing recorded in the last ${guideHours} h`);
        }

        let cloudGraphResizeTimer = null;
        window.addEventListener('resize', () => {
            // refetch, not just redraw: how many points are worth asking
            // for depends on the panel's width
            clearTimeout(cloudGraphResizeTimer);
            cloudGraphResizeTimer = setTimeout(() => {
                reloadCloudGraph();
                reloadGuideHistory();
                drawGuideLive();
                drawGuideScatter();
            }, 300);
        });

        function toggleEqualize() {
            equalizeWebcams = !equalizeWebcams;
            setCookie('equalizeWebcams', equalizeWebcams ? '1' : '0');
            document.getElementById('equalize-btn').classList.toggle('active', equalizeWebcams);
            reloadWebcams();
        }

        function openArchive() {
            window.open('/images/', '_blank');
        }

        // Preferences (dark/compact/equalize mode), persisted via cookie
        // so they survive a reload - this page has no backend of its own
        // to store per-user settings in.
        function setCookie(name, value) {
            document.cookie = `${name}=${value};path=/;max-age=31536000;samesite=lax`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return match ? match[1] : null;
        }

        let equalizeWebcams = getCookie('equalizeWebcams') === '1';
        let liveWebcams = getCookie('liveWebcams') === '1';

        function toggleLive() {
            liveWebcams = !liveWebcams;
            setCookie('liveWebcams', liveWebcams ? '1' : '0');
