<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RTS2 Devices</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>RTS2 Devices</h1>
		<nav class="header-links">
			<a href="index.html" class="back-link">image archive</a>
			<a href="targets.html" class="back-link">target list</a>
			<a href="target.html" class="back-link">target editor</a>
			<a href="records.html" class="back-link">telemetry</a>
			<a href="devices.html" class="back-link current" aria-current="page">devices</a>
			<a href="status.html" class="back-link">status</a>
			<a href="monitor.html" class="back-link">monitor</a>
		</nav>
		<div id="conn-status" class="conn-status conn-unknown">connecting&hellip;</div>
	</header>

	<section id="command-panel" class="panel">
		<h2>Send command</h2>
		<form id="rawcmd-form">
			<label>Device <select id="rawcmd-device"></select></label>
			<label>Command <input id="rawcmd-text" type="text" placeholder="e.g. stop, info" required></label>
			<div class="cmd-buttons">
				<button type="submit">Send</button>
			</div>
		</form>
		<div id="rawcmd-result"></div>
		<form id="command-form">
			<label>Device <select id="cmd-device"></select></label>
			<label>Variable <input id="cmd-name" type="text" placeholder="value name" required></label>
			<label>Value <input id="cmd-value" type="text" placeholder="new value" required></label>
			<div class="cmd-buttons">
				<button type="submit" data-op="set">Set</button>
				<button type="submit" data-op="inc">Inc</button>
				<button type="submit" data-op="dec">Dec</button>
			</div>
		</form>
		<div id="command-result"></div>
	</section>

	<section id="messages-panel" class="panel">
		<h2>Recent messages</h2>
		<ul id="messages"></ul>
	</section>

	<main id="devices"></main>

	<script src="devices.js"></script>
</body>
</html>
