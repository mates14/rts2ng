# RTS2 service startup configuration - @BASE_CONFDIR@/rts2/services
#
# One line per service: service_binary_suffix  service_name  [options]
# (`rts2-start <service_name>` runs `rts2-<service_binary_suffix> -d
# <service_name> [options]`.)
#
# Empty by default - rts2-base ships no scheduler/executor/httpd services
# (those belong to future rts2-db/rts2-httpd packages). Nothing to add
# here for a rts2-base-only install.
