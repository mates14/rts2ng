# Route every RTS2 daemon's syslog traffic (all daemons openlog() under
# the shared ident "rts2" - see Daemon::Daemon() in base/kernel) into its
# own file instead of the general syslog/messages, and stop further
# rule processing so it doesn't also land there.
if $programname == 'rts2' then /var/log/rts2.log
& stop
