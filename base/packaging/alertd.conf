# rts2-alertd configuration - keep this file mode 0600, it holds the bot token.
# Fill in, then check with `rts2-alertd --test` and
# `systemctl enable --now rts2-alertd`.

[telegram]
bot_token =
chat_id =

[alert]
# label in front of every message (default: host name)
#site = D50
# do not repeat the same alert sooner than this (daemons space their own
# repeats - the dome says "cannot start closing" every 300 s)
#repeat_seconds = 60
