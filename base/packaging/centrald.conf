# RTS2 centrald startup configuration - @BASE_CONFDIR@/rts2/centrald
#
# Uncomment and adjust the line below to have `rts2-start`/`rts2.service`
# actually start centrald. Left commented out by default so a freshly
# installed package doesn't launch a network-listening daemon before
# you've had a chance to set up rts2.ini.
#
# centrald [centrald-options]
#
# Example:
#centrald
#--server localhost
