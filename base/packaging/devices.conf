# RTS2 device startup configuration - @BASE_CONFDIR@/rts2/devices
#
# One line per device: device_family  driver_type  device_name  [options]
# `rts2-start <device_name>` (or `systemctl enable --now rts2@<device_name>`)
# starts the matching line; `rts2-start all` starts every line here.
#
# Empty by default - there is no generic default device list, every real
# site's hardware differs. Example (the dummy/no-hardware driver family,
# useful for a first smoke test):
#
#camd	dummy	C0	--wheeldev W0 --focdev F0 --width 400 --height 500 --localhost localhost
#teld	dummy	T0	--localhost localhost
#filterd	dummy	W0	-F "AA:B:C:D:E" -s 10 --localhost localhost
#focusd	dummy	F0
