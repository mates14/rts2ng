; RTS2 base configuration - @BASE_CONFDIR@/rts2/rts2.ini
;
; base note: trimmed down from the classic tree's ~490-line rts2.ini to
; just the sections rts2-base (centrald + drivers, no DB) actually reads.
; Sections used by a future rts2-db/rts2-httpd install (database, grbd,
; imgproc, scriptexec, selector, calibration, xmlrpcd, auger, ...) belong
; in those packages' own documentation, not here.
;
; [observatory] longitude/latitude/altitude are the one thing every
; daemon that reads this file (centrald, every teld mount driver,
; scriptexec, rts2-mon) requires - fill these in with your site's real
; coordinates before starting anything. This is a one-time, reasonable
; setup step, not something rts2 tries to guess for you.

[observatory]
; East-positive longitude, in degrees.
longitude = 0
; Latitude, in degrees.
latitude = 0
; Altitude above sea level, in meters.
altitude = 0

; Optional: path to a horizon-definition file (physical/hard horizon,
; used as a damage-prevention backstop independent of any scheduling
; software). Leave commented out to use a flat 0-degree horizon.
;horizon = @BASE_CONFDIR@/rts2/horizon

; Base directory for image path expansion (%b in que_path/archive_path/
; acq_path/dark_path/flat_path/trash_path - see rts2-mon or the classic
; docs for the full macro list). The code default if this is left unset
; is "/images/" - a root-owned path nothing but root can write to. Set
; here instead to a directory rts2-db's postinst actually creates and
; owns (rts2:rts2), since image writing happens under whatever user
; rts2-executor runs as. Only takes effect on a fresh install of this
; file - if you already have a customized rts2.ini, add this line to it
; by hand, a package upgrade will not silently rewrite your local edits.
base_path = /var/lib/rts2/images/

[centrald]
; Uncomment to switch the system to standby (rather than off) each
; morning - see rts2-centrald --help for the full set of options this
; section can also carry.
;morning_off = false
;morning_standby = true
