# DKMS build of the bundled fliusb kernel module (packaged as fliusb-dkms,
# see base/debian/rules): rebuilt for every kernel installed, so a kernel
# API change shows up as a failed build at upgrade time rather than as a
# camera that is gone at the start of a night.
PACKAGE_NAME="fliusb"
PACKAGE_VERSION="1.5"
BUILT_MODULE_NAME[0]="fliusb"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
